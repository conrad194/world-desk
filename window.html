<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Three-Country Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading desk. A sticky "window frame" header with the date and views; a single 720px reading column for Today and Lessons, a wider 1080px desk for the working views. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --surface-2: #F5F7F9;
  --ink: #17202A;
  --muted: #5A6674;
  --line: #D6DCE3;
  --accent: #0D6B5B;
  --accent-soft: #DCEFEA;
  --us: #2B4F9E;  --us-soft: #E3E9F6;
  --pl: #BE2B3A;  --pl-soft: #F7E1E3;
  --krk: #9A5B12; --krk-soft: #F4E8D7;
  --in: #C9650E;  --in-soft: #FAE8D6;
  --rel: #6A4EA3; --rel-soft: #ECE6F6;
  --good: #1F7A44; --good-soft: #DDF0E4;
  --warn: #9A6400; --warn-soft: #F7ECD2;
  --bad: #B3261E;  --bad-soft: #F8DEDB;
  --info: #3D5A80; --info-soft: #E2E9F2;
  --heat: 13, 107, 91;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F141A; --surface: #172029; --surface-2: #1C2631; --ink: #E5EAF0; --muted: #94A1AF; --line: #2B3643;
    --accent: #4CC2A6; --accent-soft: #163A33;
    --us: #8FAEF0; --us-soft: #1D2A45; --pl: #F08A95; --pl-soft: #3E1D22; --krk: #E0AE6A; --krk-soft: #3A2A16;
    --in: #F2A45C; --in-soft: #3D2814; --rel: #BCA6EE; --rel-soft: #2A2240;
    --good: #6CD39A; --good-soft: #17352A; --warn: #E9C06A; --warn-soft: #3A2E14; --bad: #F2948C; --bad-soft: #3F1D1A;
    --info: #9DB8DE; --info-soft: #1E2B3D; --heat: 76, 194, 166;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F141A; --surface: #172029; --surface-2: #1C2631; --ink: #E5EAF0; --muted: #94A1AF; --line: #2B3643;
  --accent: #4CC2A6; --accent-soft: #163A33;
  --us: #8FAEF0; --us-soft: #1D2A45; --pl: #F08A95; --pl-soft: #3E1D22; --krk: #E0AE6A; --krk-soft: #3A2A16;
  --in: #F2A45C; --in-soft: #3D2814; --rel: #BCA6EE; --rel-soft: #2A2240;
  --good: #6CD39A; --good-soft: #17352A; --warn: #E9C06A; --warn-soft: #3A2E14; --bad: #F2948C; --bad-soft: #3F1D1A;
  --info: #9DB8DE; --info-soft: #1E2B3D; --heat: 76, 194, 166;
  color-scheme: dark;
}
:root { --wk-p: var(--rel); --wk-e: var(--in); }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
.panes { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 8px; }
.panes i { display: block; width: 9px; height: 18px; border-radius: 2px; }
.panes i:nth-child(1){ background: var(--us);} .panes i:nth-child(2){ background: var(--pl);} .panes i:nth-child(3){ background: var(--in);}
.brand .today { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; font-weight: 500; font-size: 0.92rem; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

main { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
.view { display: grid; gap: 22px; }
.col { max-width: 760px; margin: 0 auto; width: 100%; display: grid; gap: 22px; min-width: 0; }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: 0.9rem; }

/* Sections */
.sec { display: grid; gap: 10px; min-width: 0; }
.sec > h2, .h2 { font-family: var(--f-body); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; }
.sec > h2 .count, .h2 .count { font-family: var(--f-mono); letter-spacing: 0; font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; color: var(--muted); }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.prose p { margin: 0 0 0.8em; } .prose p:last-child { margin-bottom: 0; }
.prose { max-width: 68ch; }

/* Date bar */
.datebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.datebar .when { font-family: var(--f-display); font-size: 1.9rem; font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; }
.datebar .sub { color: var(--muted); font-size: 0.9rem; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; font-size: 0.88rem; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Lesson card */
.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px; display: grid; gap: 14px; }
.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; color: var(--accent); letter-spacing: 0.02em; }
.lesson h3 { font-family: var(--f-display); font-weight: 600; font-size: 1.65rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.lesson .prose { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.6; }
details.recall-prev { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; }
details.recall-prev summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.innews { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
.innews b { display: block; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.recall { background: var(--accent-soft); border-radius: 8px; padding: 12px 14px; }
.recall b { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 2px; }

/* Top 5 */
ol.top5 { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: t; }
ol.top5 li { counter-increment: t; display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
ol.top5 li:first-child { border-top: 0; padding-top: 2px; }
ol.top5 li::before { content: counter(t); font-family: var(--f-display); font-size: 1.6rem; line-height: 1; color: var(--accent); font-weight: 600; }
ol.top5 .txt { min-width: 0; }

/* Place tabs */
.ptabs { display: flex; gap: 6px; flex-wrap: wrap; }
.ptab { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px 6px 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 7px; }
.ptab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--pc); }
.ptab .n { font-family: var(--f-mono); font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.ptab[aria-selected="true"] { background: var(--pcs); border-color: var(--pc); }
[data-pc="us"] { --pc: var(--us); --pcs: var(--us-soft); }
[data-pc="pl"] { --pc: var(--pl); --pcs: var(--pl-soft); }
[data-pc="krk"] { --pc: var(--krk); --pcs: var(--krk-soft); }
[data-pc="in"] { --pc: var(--in); --pcs: var(--in-soft); }
[data-pc="rel"] { --pc: var(--rel); --pcs: var(--rel-soft); }
.pchip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; color: var(--pc); background: var(--pcs); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }

/* News items */
.dgroup { display: grid; gap: 0; }
.dgroup + .dgroup { margin-top: 10px; }
.dlabel { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .txt { min-width: 0; display: grid; gap: 5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; }
.tier { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 500; border-radius: 4px; padding: 1px 6px; height: fit-content; margin-top: 3px; white-space: nowrap; }
.tier.t1 { background: var(--ink); color: var(--surface); }
.tier.t2 { border: 1px solid var(--muted); color: var(--ink); }
.tier.t3 { border: 1px dashed var(--line); color: var(--muted); }
.ver { border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 0.72rem; }
.ver.Confirmed { background: var(--good-soft); color: var(--good); }
.ver.Reported { background: var(--info-soft); color: var(--info); }
.ver.Claimed { background: var(--warn-soft); color: var(--warn); }
.ver.Single-source { background: var(--bad-soft); color: var(--bad); }
.thread { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; color: var(--muted); cursor: pointer; font-size: 0.75rem; }
.thread:hover { color: var(--ink); border-color: var(--accent); }
.lnk { font-size: 0.8rem; text-decoration: none; border-bottom: 1px solid currentColor; }
.idtag { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }

/* City strip */
.city { display: grid; gap: 6px; background: var(--krk-soft); border-radius: 8px; padding: 12px 14px; }
.city b { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--krk); }
.city ul { margin: 0; padding-left: 18px; }

/* Relations */
.relgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.relgrid .panel h3 { margin: 0 0 4px; font-size: 0.95rem; }

/* Rule cards */
.rules { display: grid; gap: 12px; }
.rule { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; min-width: 0; }
.rule h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; }
.rule .who { font-size: 0.86rem; }
.track { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.track span { height: 6px; border-radius: 3px; background: var(--line); }
.track span.done { background: var(--accent); }
.tracklabels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; font-size: 0.68rem; color: var(--muted); }
.tracklabels span { min-width: 0; overflow-wrap: anywhere; }
.tracklabels span.cur { color: var(--ink); font-weight: 700; }
.flag { border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 0.75rem; }
.flag.soon { background: var(--good-soft); color: var(--good); }
.flag.due { background: var(--warn-soft); color: var(--warn); }
.flag.bad { background: var(--bad-soft); color: var(--bad); }
.flag.neutral { background: var(--surface-2); color: var(--muted); }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 4px 12px; font-size: 0.88rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Deep dive */
.deep { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 10px; }
.deep h3 { font-family: var(--f-display); font-size: 1.45rem; font-weight: 600; margin: 0; line-height: 1.2; text-wrap: balance; }
.deep .prose { font-family: var(--f-display); font-size: 1.08rem; line-height: 1.6; }

/* Reading cards */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; line-height: 1.3; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; font-size: 0.88rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
textarea, input[type="text"], input[type="search"], select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { min-height: 70px; resize: vertical; line-height: 1.5; }

/* Coming up */
.uplist { display: grid; gap: 0; }
.up { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.up:last-child { border-bottom: 0; }
.up .d { font-family: var(--f-mono); font-size: 0.8rem; }
.up .d small { display: block; color: var(--muted); }
.gaps { display: flex; flex-wrap: wrap; gap: 6px; }
.gap { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.8rem; background: var(--surface); }
.gap.ns { border-color: var(--bad); color: var(--bad); }
ul.srcs { margin: 0; padding-left: 18px; columns: 2 280px; column-gap: 28px; font-size: 0.88rem; }
ul.srcs li { break-inside: avoid; margin-bottom: 4px; overflow-wrap: anywhere; }

/* Lessons */
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; min-width: 120px; }
.stat .v { font-family: var(--f-display); font-size: 1.8rem; font-weight: 600; line-height: 1; }
.stat .l { font-size: 0.78rem; color: var(--muted); }
.unit { display: grid; gap: 8px; }
.unit h3 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; }
.path { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-align: left; width: 100%; cursor: pointer; }
.lrow:disabled { cursor: default; background: var(--surface-2); }
.lrow .num { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.lrow .st { font-size: 0.75rem; font-weight: 600; border-radius: 4px; padding: 1px 7px; }
.st.done { background: var(--good-soft); color: var(--good); }
.st.revisit { background: var(--warn-soft); color: var(--warn); }
.st.next { background: var(--accent-soft); color: var(--accent); }
.st.later { color: var(--muted); }
.ldetail { border: 1px solid var(--accent); border-radius: 12px; }
table.cmp { min-width: 560px; }
table.cmp th[scope="row"] { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 0.85rem; width: 22%; }
dl.terms { grid-template-columns: minmax(110px, 30%) 1fr; }
dl.terms dt { color: var(--ink); font-weight: 600; }

/* Timeline */
.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 0.82rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; }
.dayhead { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; margin: 6px 0 0; }

/* Watch */
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 8px; }
.wcard.due { border-color: var(--bad); }
.verdicts { display: flex; flex-wrap: wrap; gap: 6px; }

/* Quiz */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.q h3 { margin: 0; font-size: 1rem; line-height: 1.4; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.score { font-family: var(--f-display); font-size: 1.4rem; font-weight: 600; }
.syn { display: grid; gap: 8px; }

/* Coverage */
.scroll { overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 3px; font-size: 0.82rem; min-width: 760px; }
table.grid th { font-weight: 600; text-align: left; color: var(--muted); padding: 4px 6px; vertical-align: bottom; }
table.grid th.c { text-align: center; }
table.grid td.n { width: 72px; height: 32px; text-align: center; border-radius: 4px; font-family: var(--f-mono); }
table.grid td.zero { background: var(--bad-soft); color: var(--bad); }
table.grid td.na { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.plain th, table.plain td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
table.plain td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Library */
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }
.primer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.primer h3 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; font-weight: 600; }
.primer .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.primer h4 { margin: 0 0 4px; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.primer .now { background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; }


/* Home link, Edit link and editor */
.homelink { font-size: 0.82rem; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 2px; }
.homelink:hover { color: var(--ink); text-decoration: underline; }
.brandr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.editlink { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--ink); background: var(--surface); }
.editlink:hover { border-color: var(--accent); }

.savebar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

/* Wikipedia names (p) and events (e), and side notes */
.wk { text-decoration: underline; text-underline-offset: 2px; text-decoration-thickness: 1px; }
.wk-p { color: var(--wk-p); }
.wk-e { color: var(--wk-e); text-decoration-style: dotted; }

.snote-p { font-size: 0.9em; color: var(--muted); background: var(--surface-2); border-left: 3px solid var(--line); border-radius: 4px; padding: 6px 10px; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 0.88rem; z-index: 20; }
@media (max-width: 560px) {
  .datebar .when { font-size: 1.5rem; }

  .kv { grid-template-columns: 1fr; }

}

  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}

<body>
<!-- Three-Country Window. Content is loaded from the data folder, which the daily runs update. -->


<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div><a class="homelink" href="./">← Home</a><h1><span class="panes" aria-hidden="true"><i></i><i></i><i></i></span><span id="siteTitle">Three-Country Window</span></h1></div>
      <div class="brandr"><span class="today" id="todayLabel"></span><a class="editlink" href="#edit">Edit</a></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <a href="#today">Today</a>
      <a href="#lessons">Lessons</a>
      <a href="#timeline">Timeline</a>
      <a href="#rules">Rules &amp; laws</a>
      <a href="#watch">Watch</a>
      <a href="#reading">Reading</a>
      <a href="#sunday">Sunday</a>
      <a href="#coverage">Coverage</a>
      <a href="#library">Library</a>
      <a href="#how">How it works</a>
    </nav>
  </div>
</header>
<main>
  <div id="status" hidden class="banner"></div>
  <div id="app"></div>
</main>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
"use strict";

/* ---------- Constants ---------- */
const PLACES = ["US", "Poland", "Kraków", "India"];
const RELS = ["US–Poland", "US–India", "Poland–India", "US–Poland–India"];
const ALL_PLACES = PLACES.concat(RELS);
const PC = { "US": "us", "Poland": "pl", "Kraków": "krk", "India": "in", "EU (applies in Poland)": "pl" };
const pc = p => PC[p] || "rel";
const DOMAINS = ["Politics & government", "Law, courts & regulation", "Economy, business & markets", "Trade & tariffs",
  "Health, medicine & food safety", "Science & space", "Technology, AI & cyber", "Defense, security & crime",
  "Foreign relations", "Society: education, labor, immigration", "Environment, energy & disasters",
  "Infrastructure, transport & housing", "Culture, media & sport"];
const STAGES = ["Proposed", "Open for comment", "Passed / final", "Signed / published", "In force"];
const SIDE_STAGES = ["Challenged in court", "Struck down / withdrawn"];
const WATCH_STATUS = ["Happened as expected", "Partly", "Did not happen", "Postponed"];
const AREAS = ["US", "Poland", "Kraków", "India", "Relations"];
const VIEWS = ["edit", "today", "lessons", "timeline", "rules", "watch", "reading", "sunday", "coverage", "library", "how"];

/* ---------- State ---------- */
const S = {
  db: null, user: null, dl: null, canWrite: true, ready: false, dbMissing: false,
  briefs: [], briefIdx: 0, olderBriefsDone: false,
  eventDays: [], olderEventsDone: false,
  rules: [], watch: [], reading: [], lessons: [], curriculum: null, weekly: [], mine: {},
  threads: [], sources: [], primers: [],
  ui: { place: "US", lessonOpen: null, lq: {}, tl: { place: "", domain: "", tier: "", thread: "", q: "" }, tlShow: 20,
        rulesPlace: "", readFilter: "unread", libTab: "primers", srcPlace: "", covDays: 7, week: null, synDraft: {} }
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u.trim())) ? u.trim() : "";
const arr = v => Array.isArray(v) ? v : [];
function decodeEnt(s) { return s.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
function wikiUrl(title) { return "https://en.wikipedia.org/wiki/" + encodeURIComponent(decodeEnt(title).trim().replace(/ /g, "_")).replace(/%2F/g, "/").replace(/%3A/g, ":").replace(/%2C/g, ",").replace(/%28/g, "(").replace(/%29/g, ")"); }
function inline(t) {
  let s = esc(t);
  // Wikipedia names and events: [[p:Shown|Title]] / [[e:Shown|Title]]
  s = s.replace(/\[\[([pe]):([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, k, shown, title) => `<a class="wk wk-${k}" href="${esc(wikiUrl(title || shown))}" target="_blank" rel="noopener">${shown}</a>`);
  // Wikipedia names and events: [@Name](url) / [#Event](url)
  s = s.replace(/\[([@#])([^\]]+)\]\((https?:\/\/[^\s()]*(?:\([^\s()]*\)[^\s()]*)*)\)/g, (m, k, a, u) => `<a class="wk wk-${k === "@" ? "p" : "e"}" href="${u}" target="_blank" rel="noopener">${a}</a>`);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s()]*(?:\([^\s()]*\)[^\s()]*)*)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  // Side notes: {{note: ...}}
  s = s.replace(/\{\{\s*note:\s*([\s\S]*?)\}\}/g, (m, n) => `<span class="snote">${n.trim()}</span>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return s;
}
function md(t) {
  if (!t) return "";
  return String(t).split(/\n\s*\n/).map(p => {
    const q = p.trim();
    if (q.startsWith(">")) return `<p class="snote-p">${inline(q.replace(/^>\s?/gm, "")).replace(/\n/g, "<br>")}</p>`;
    return `<p>${inline(p).replace(/\n/g, "<br>")}</p>`;
  }).join("");
}
function linkHtml(l, i) {
  if (!l) return "";
  const url = safeUrl(typeof l === "string" ? l : l.url);
  if (!url) return "";
  let label = (typeof l === "object" && l.label) ? l.label : "";
  if (!label) { try { label = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { label = "Source " + (i + 1); } }
  return `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDate(new Date());
function parseD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function daysFrom(s) { const d = parseD(s); if (!d) return null; const t = parseD(todayIso()); return Math.round((d - t) / 86400000); }
function fmtD(s, opts) { const d = parseD(s); return d ? d.toLocaleDateString("en-GB", opts || { day: "numeric", month: "short", year: "numeric" }) : esc(s || ""); }
function fmtLong(s) { return fmtD(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
function rel(n) { if (n == null) return ""; if (n === 0) return "today"; if (n === 1) return "tomorrow"; if (n === -1) return "yesterday"; return n > 0 ? `in ${n} days` : `${-n} days ago`; }
function mondayOf(s) { const d = parseD(s) || new Date(); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return isoDate(d); }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
const pchip = p => p ? `<span class="pchip" data-pc="${pc(p)}">${esc(p)}</span>` : "";
const tierTag = t => t ? `<span class="tier t${esc(t)}">T${esc(t)}</span>` : `<span></span>`;
const verTag = v => v ? `<span class="ver ${esc(String(v).replace(/\s+/g, "-"))}">${esc(v)}</span>` : "";
const threadTag = t => t ? `<button class="thread" data-act="thread" data-thread="${esc(t)}">${esc(t)}</button>` : "";
const empty = (title, body) => `<div class="empty"><strong>${esc(title)}</strong>${body}</div>`;

/* ---------- Static data layer: files published by the daily runs, personal state in this browser ---------- */
const BASE = "data/window/";
const LS_KEY = "window:mine";
function loadMine() { try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v && typeof v === "object") return { docs: v.docs || {}, mine: v.mine || {} }; } catch (e) {} return { docs: {}, mine: {} }; }
function saveMine() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.my)); return true; } catch (e) { return false; } }
function applyPatch(path, patch) {
  const parts = path.split("/"), coll = parts[0], id = parts.slice(1).join("/");
  if (coll === "mine") { S.mine[id] = Object.assign({}, S.mine[id] || {}, patch); S.my.mine[id] = S.mine[id]; return; }
  S.my.docs[path] = Object.assign({}, S.my.docs[path] || {}, patch);
  const list = S[coll]; const it = Array.isArray(list) ? list.find(x => x._id === id) : null; if (it) Object.assign(it, patch);
}
function write(path, fn) {
  const ref = { update: async p => applyPatch(path, p), set: async p => applyPatch(path, p), get: async () => ({ exists: true }) };
  return Promise.resolve(fn(ref)).then(() => { if (!saveMine()) toast("Couldn't save in this browser. Private browsing or blocked storage may be the cause."); render(); });
}
const upsert = (path, patch) => write(path, r => r.update(patch));
function overlay(coll, items) { return items.map(x => { x = Object.assign({}, x); x._id = x.id != null ? String(x.id) : x._id; const p = S.my.docs[coll + "/" + x._id]; return p ? Object.assign(x, p) : x; }); }
async function getJson(p) { const rc = recentGet(p); if (rc) return JSON.parse(JSON.stringify(rc)); const r = await fetch(BASE + p + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" }); if (!r.ok) throw new Error(String(r.status)); return r.json(); }
const itemsOf = j => Array.isArray(j) ? j : (j && Array.isArray(j.items) ? j.items : []);
function mergeBy(a, b, key) {
  const m = new Map(); a.concat(b).forEach(x => { if (x && !m.has(x[key])) m.set(x[key], x); });
  return Array.from(m.values()).sort((x, y) => String(y[key]).localeCompare(String(x[key])));
}

async function boot() {
  $("#todayLabel").textContent = fmtLong(todayIso());
  route(); window.addEventListener("hashchange", route);
  S.my = loadMine(); S.mine = Object.assign({}, S.my.mine);
  S.canWrite = true;
  S.dl = { save: async ({ filename, data }) => { const url = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return { status: "saved" }; } };
  try { S.site = mergeSite(await getJson("site.json")); } catch (e) { S.site = mergeSite(null); }
  applySite();
  let man = null;
  try { man = await getJson("manifest.json"); } catch (e) { showStatus("Nothing published yet. The first daily run fills this page."); render(); return; }
  S.man = man; S.db = {};
  $("#status").hidden = true;
  const singles = ["rules", "watch", "reading", "lessons", "threads", "sources", "primers"];
  await Promise.all(singles.map(async c => { try { S[c] = overlay(c, itemsOf(await getJson(c + ".json"))); } catch (e) { S[c] = []; } }));
  if (typeof afterSingles === "function") afterSingles(); loadCurriculum();
  const pick = (k, n) => (Array.isArray(man[k]) ? man[k] : []).slice().sort().reverse().slice(0, n);
  const briefs = await Promise.all(pick("briefs", 7).map(d => getJson("briefs/" + d + ".json").catch(() => null)));
  S.briefs = mergeBy(briefs.filter(Boolean), [], "date");
  S.olderBriefsDone = (man.briefs || []).length <= S.briefs.length;
  const evs = await Promise.all(pick("events", 30).map(d => getJson("events/" + d + ".json").catch(() => null)));
  S.eventDays = mergeBy(evs.filter(Boolean), [], "date");
  S.olderEventsDone = (man.events || []).length <= S.eventDays.length;
  const wk = await Promise.all(pick("weekly", 26).map(d => getJson("weekly/" + d + ".json").catch(() => null)));
  S.weekly = wk.filter(Boolean).sort((a, b) => String(b.weekStart).localeCompare(String(a.weekStart)));
  S.ready = true;
  render();
}
async function loadOlderBriefs() {
  if (!S.man) { S.olderBriefsDone = true; return; }
  const have = new Set(S.briefs.map(b => b.date));
  const next = (S.man.briefs || []).slice().sort().reverse().filter(d => !have.has(d)).slice(0, 7);
  if (!next.length) { S.olderBriefsDone = true; return; }
  const got = await Promise.all(next.map(d => getJson("briefs/" + d + ".json").catch(() => null)));
  S.briefs = mergeBy(S.briefs, got.filter(Boolean), "date");
  if ((S.man.briefs || []).length <= S.briefs.length) S.olderBriefsDone = true;
}
async function loadOlderEvents(n) {
  if (!S.man) return false;
  const have = new Set(S.eventDays.map(b => b.date));
  const next = (S.man.events || []).slice().sort().reverse().filter(d => !have.has(d)).slice(0, n || 30);
  if (!next.length) { S.olderEventsDone = true; return false; }
  const got = await Promise.all(next.map(d => getJson("events/" + d + ".json").catch(() => null)));
  S.eventDays = mergeBy(S.eventDays, got.filter(Boolean), "date");
  if ((S.man.events || []).length <= S.eventDays.length) S.olderEventsDone = true;
  return true;
}
function afterSingles() {
  S.lessons.sort((x, y) => (+x.num || 0) - (+y.num || 0));
}
async function loadCurriculum() { try { S.curriculum = await getJson("curriculum.json"); } catch (e) { S.curriculum = null; } render(); }
function allEvents() {
  const out = [];
  S.eventDays.forEach(day => arr(day.items).forEach(it => out.push(Object.assign({ _day: day.date }, it))));
  return out;
}
function showStatus(m) { const s = $("#status"); s.textContent = m; s.hidden = false; }

/* ---------- Routing ---------- */
function route() {
  const h = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(h) ? h : "today";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + S.view ? "page" : "false"));
  const cur = document.querySelector('#tabs a[aria-current="page"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  render();
  window.scrollTo(0, 0);
}

/* ---------- Render ---------- */
function render() {
  const app = $("#app");
  const keepFocus = document.activeElement && document.activeElement.id;
  const fn = { edit: vEdit, today: vToday, lessons: vLessons, timeline: vTimeline, rules: vRules, watch: vWatch, reading: vReading, sunday: vSunday, coverage: vCoverage, library: vLibrary, how: vHow }[S.view];
  // Don't clobber text the person is typing
  if (document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName) && document.activeElement.dataset.keep && app.contains(document.activeElement)) return;
  app.innerHTML = `<div class="view">${fn()}</div>`;
  if (keepFocus) { const el = document.getElementById(keepFocus); if (el && el.tagName === "INPUT" && el.type === "search") { el.focus(); const v = el.value; el.value = ""; el.value = v; } }
}

/* Item renderer used by Today and Timeline */
function itemHtml(it, opts) {
  opts = opts || {};
  const links = arr(it.links).length ? arr(it.links) : [it.link1 && { url: it.link1, label: it.outlet || "" }, it.link2 && { url: it.link2, label: "Cross-check" }, it.archive && { url: it.archive, label: "Archive" }].filter(Boolean);
  return `<div class="item">${tierTag(it.tier)}<div class="txt">
    <div>${inline(it.text || "")}</div>
    <div class="meta">${opts.place ? pchip(it.place) : ""}${opts.domain && it.domain ? `<span class="muted">${esc(it.domain)}</span>` : ""}${verTag(it.verification)}${threadTag(it.thread)}
      ${links.map(linkHtml).join(" ")}${it.paywalled === "Y" || it.paywalled === true ? `<span class="muted">paywall</span>` : ""}${it.id ? `<span class="idtag">${esc(it.id)}</span>` : ""}</div>
  </div></div>`;
}
function groupByDomain(items) {
  const g = {}; items.forEach(it => { const d = it.domain || "Other"; (g[d] = g[d] || []).push(it); });
  const order = DOMAINS.concat(Object.keys(g).filter(k => !DOMAINS.includes(k)));
  return order.filter(d => g[d]).map(d => `<div class="dgroup"><div class="dlabel">${esc(d)}</div>${g[d].sort((a, b) => (+a.tier || 9) - (+b.tier || 9)).map(i => itemHtml(i)).join("")}</div>`).join("");
}

/* ---------- Today ---------- */
function todayDates() {
  const s = new Set(S.briefs.map(b => b.date));
  S.lessons.forEach(l => { if (l.dateTaught) s.add(l.dateTaught); });
  return Array.from(s).filter(Boolean).sort().reverse();
}
function lessonFor(date) {
  const ls = S.lessons.filter(l => l.dateTaught === date);
  return ls.find(l => !l.review) || ls[0] || null;
}
/* One lesson card, used on Today (today=true) and in Lessons */
function lessonCard(L, doc, today) {
  const key = doc ? doc._id : "brief-" + (L.num || "");
  const ans = S.ui.lq[key] || {};
  const cmp = arr(L.comparison);
  const terms = arr(L.keyTerms);
  const news = arr(L.newsEvents).map(id => { const e = allEvents().find(x => x.id === id); return e ? `<li>${inline(e.text)} ${pchip(e.place)} <span class="idtag">${esc(id)}</span></li>` : ""; }).join("");
  return `<article class="lesson ${today ? "" : "ldetail"}">
    <div class="eyebrow">${L.review ? "Weekly review" : "Lesson " + esc(L.num)}${L.unit ? " · " + esc(L.unit) : ""}${L.pulledForward ? " · pulled forward for today's news" : ""}${L.minutes ? " · " + esc(L.minutes) + " min read" : ""}${!today && L.dateTaught ? " · taught " + fmtD(L.dateTaught) : ""}</div>
    ${today && L.prevAnswer ? `<details class="recall-prev"><summary>Yesterday's question: ${esc(L.prevQuestion || "show the answer")}</summary><div class="prose" style="margin-top:6px">${md(L.prevAnswer)}</div></details>` : ""}
    <h3>${esc(L.title)}</h3>
    <div class="prose">${md(L.body)}</div>
    ${cmp.length ? `<div class="sec"><div class="h2">Side by side</div><div class="scroll"><table class="plain cmp"><thead><tr><th></th>${["US", "Poland", "India"].map(p => `<th><span class="pchip" data-pc="${pc(p)}">${p}</span></th>`).join("")}</tr></thead><tbody>${cmp.map(r => `<tr><th scope="row">${esc(r.aspect)}</th><td>${inline(r.US || "")}</td><td>${inline(r.Poland || "")}</td><td>${inline(r.India || "")}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
    ${terms.length ? `<div class="sec"><div class="h2">Key terms</div><dl class="kv terms">${terms.map(t => `<dt>${esc(t.term)}</dt><dd>${inline(t.meaning)}</dd>`).join("")}</dl></div>` : ""}
    ${L.example ? `<div class="innews"><b>Case in point</b><div class="prose">${md(L.example)}</div></div>` : ""}
    ${L.inTheNews || news ? `<div class="innews"><b>In today's news</b>${inline(L.inTheNews || "")}${news ? `<ul style="margin:6px 0 0;padding-left:18px">${news}</ul>` : ""}</div>` : ""}
    ${arr(L.check).length ? `<div class="sec"><div class="h2">Quick check</div>${arr(L.check).map((q, k) => { const a = ans[k]; const done = a != null; return `<div class="q"><h3>${inline(q.q)}</h3><div class="opts">${arr(q.options).map((o, j) => `<button class="opt ${done && j === +q.answer ? "right" : ""} ${done && j === +a && +a !== +q.answer ? "wrong" : ""}" data-act="lcheck" data-key="${esc(key)}" data-k="${k}" data-j="${j}" ${done ? "disabled" : ""}>${inline(o)}</button>`).join("")}</div>${done && q.explain ? `<div class="small">${inline(q.explain)}</div>` : ""}</div>`; }).join("")}</div>` : ""}
    ${L.recallQ ? (today ? `<div class="recall"><b>Think about it</b>${inline(L.recallQ)}<div class="small muted">The answer opens tomorrow's lesson.</div></div>` : `<details class="recall-prev"><summary>Recall: ${esc(L.recallQ)}</summary><div class="prose" style="margin-top:6px">${md(L.recallA || "The answer opened the next day's lesson.")}</div></details>`) : ""}
    ${arr(L.readMore).length ? `<div class="sec"><div class="h2">Go deeper</div><ul style="margin:0;padding-left:18px">${arr(L.readMore).map((r, k) => `<li>${linkHtml({ url: r.url, label: r.title }, k)}${r.why ? ` <span class="small muted">${inline(r.why)}</span>` : ""}</li>`).join("")}</ul></div>` : ""}
    ${doc && S.canWrite ? `<div class="btnrow"><span class="small muted">How did this land?</span>
      <button class="btn ${doc.understood === "got" ? "on" : ""}" data-act="understood" data-id="${esc(doc._id)}" data-v="got">Got it</button>
      <button class="btn ${doc.understood === "revisit" ? "on" : ""}" data-act="understood" data-id="${esc(doc._id)}" data-v="revisit">Revisit later</button></div>
      <textarea id="lnote-${esc(doc._id)}" data-keep="1" data-act="lessonNote" data-id="${esc(doc._id)}" placeholder="Your notes on this lesson">${esc(doc.notes || "")}</textarea>` : ""}
  </article>`;
}
function vToday() {

  }
  const i = Math.min(S.briefIdx, dates.length - 1);
  const date = dates[i];
  const b = S.briefs.find(x => x.date === date) || null;

  const L = lessonDoc || (b && b.lesson) || null;

  let h = `<div class="col">
  <div class="datebar">
    <div><p class="when">${fmtLong(date)}</p><div class="sub">${b && b.deepDive && b.deepDive.domain ? "Deep dive: " + esc(b.deepDive.domain) : ""}</div></div>

      <button class="btn" data-act="newer" ${i === 0 ? "disabled" : ""} aria-label="Newer day">Newer →</button>

  if (L) h += lessonCard(L, lessonDoc, true);
  else if (date === todayIso()) h += `<div class="empty small">Today's lesson appears here once the lesson run has finished.</div>`;
  if (!b) return h + empty("No news brief for this day yet.", `<p>The news run writes the brief each morning. If it's missing, the run may still be going or was cut off; the next run catches up on anything missed.</p>`) + `</div>`;
  const myDay = S.mine["day-" + b.date] || {};

    <div class="panel">
      ${sel === "Kraków" && arr(b.city).length ? `<div class="city" style="margin-bottom:10px"><b>Today in the city</b><ul>${arr(b.city).map(c => { const o = typeof c === "string" ? { text: c } : c; return `<li>${o.kind ? `<strong>${esc(o.kind)}:</strong> ` : ""}${inline(o.text)} ${linkHtml(o.link || (o.links && o.links[0]), 0)}</li>`; }).join("")}</ul></div>` : ""}
      ${selItems.length ? groupByDomain(selItems) : `<p class="muted" style="margin:0">Nothing at Tier 1 or 2 for ${esc(sel)} in this brief. Check coverage gaps below.</p>`}
    </div></section>`;

  const relations = b.relations || {};
  const relHas = RELS.some(r => arr(relations[r]).length);
  h += `<section class="sec"><h2>${esc(H("relations", "Relations"))}</h2>${relHas ? `<div class="relgrid">${RELS.filter(r => arr(relations[r]).length).map(r => `<div class="panel" data-pc="rel"><h3><span class="pchip" data-pc="rel">${esc(r)}</span></h3>${arr(relations[r]).map(i => itemHtml(i)).join("")}</div>`).join("")}</div>` : `<p class="muted small" style="margin:0">No new developments between the three countries in this brief.</p>`}</section>`;

  if (arr(b.rules).length) {
    h += `<section class="sec"><h2>${esc(H("rules", "Rules & laws"))} <span class="count">${arr(b.rules).length}</span></h2><div class="rules">${arr(b.rules).map(r => {
      const full = r.id ? S.rules.find(x => x._id === r.id || x.id === r.id) : null;
      return ruleCard(Object.assign({}, r, full || {}), true);
    }).join("")}</div></section>`;
  }

  if (b.deepDive && (b.deepDive.body || b.deepDive.title)) {
    const dd = b.deepDive;
    h += `<section class="sec"><h2>${esc(H("deepDive", "Deep dive"))}</h2><article class="deep"><div class="eyebrow">${esc(dd.domain || "")}</div><h3>${esc(dd.title || "")}</h3><div class="prose">${md(dd.body)}</div>${arr(dd.links).length ? `<div class="meta">${arr(dd.links).map(linkHtml).join(" ")}</div>` : ""}</article></section>`;
  }

  if (arr(b.readInFull).length) {
    h += `<section class="sec"><h2>${esc(H("readInFull", "Read in full"))}</h2><div class="cards">${arr(b.readInFull).map(r => {
      const doc = r.readingId ? S.reading.find(x => x._id === r.readingId) : null;
      return readingCard(Object.assign({}, r, doc || {}), doc ? doc._id : null);
    }).join("")}</div></section>`;
  }

  if (arr(b.comingUp).length) {
    h += `<section class="sec"><h2>${esc(H("comingUp", "Coming up"))}</h2><div class="panel uplist">${arr(b.comingUp).sort((x, y) => String(x.date).localeCompare(String(y.date))).map(c => `<div class="up"><div class="d">${fmtD(c.date, { day: "numeric", month: "short" })}<small>${rel(daysFrom(c.date))}</small></div><div>${inline(c.text)} <span class="meta" style="display:inline-flex">${pchip(c.place)}</span></div></div>`).join("")}</div></section>`;
  }

  if (arr(b.gaps).length) {
    h += `<section class="sec"><h2>${esc(H("gaps", "Coverage gaps"))}</h2><div class="gaps">${arr(b.gaps).map(g => `<span class="gap ${/no source/i.test(g.status || "") ? "ns" : ""}" title="${esc(g.status || "")}">${esc(g.place)} · ${esc(g.domain)} — ${esc(g.status || "quiet")}</span>`).join("")}</div><div class="small muted">Red means nothing was found because sources were missing, not because it was quiet.</div></section>`;
  }

  if (arr(b.sources).length) {
    h += `<section class="sec"><h2>${esc(H("sources", "Sources"))} <span class="count">${arr(b.sources).length}</span></h2><div class="panel"><ul class="srcs">${arr(b.sources).map((s, k) => `<li>${linkHtml(typeof s === "string" ? s : { url: s.url, label: s.title || s.label }, k)}${s.paywalled ? ' <span class="muted">(paywall)</span>' : ""}</li>`).join("")}</ul></div></section>`;
  }

  if (S.canWrite) {
    h += `<div class="panel btnrow" style="justify-content:space-between"><span>Done for today?</span>
      <label class="check"><input type="checkbox" id="briefRead" data-act="briefRead" data-date="${esc(b.date)}" ${myDay.briefRead ? "checked" : ""}> I read this brief</label></div>`;
  }
  return h + `</div>`;
}

function ruleCard(r, compact) {
  const idx = STAGES.indexOf(r.stage);
  const side = SIDE_STAGES.includes(r.stage);
  const eff = r.effectiveDate ? daysFrom(r.effectiveDate) : null;
  const com = r.commentDeadline ? daysFrom(r.commentDeadline) : null;
  let flags = "";
  if (side) flags += `<span class="flag bad">${esc(r.stage)}</span>`;
  if (eff != null) flags += eff >= 0 ? `<span class="flag ${eff <= 14 ? "soon" : "neutral"}">Takes effect ${fmtD(r.effectiveDate)} · ${rel(eff)}</span>` : `<span class="flag neutral">In effect since ${fmtD(r.effectiveDate)}</span>`;
  if (com != null && com >= 0) flags += `<span class="flag due">Comments close ${fmtD(r.commentDeadline)} · ${rel(com)}</span>`;
  const changes = r.changes || r.summary || "";
  return `<article class="rule">
    <div class="meta">${pchip(r.place)}${r.body ? `<span class="muted">${esc(r.body)}</span>` : ""}${r.id ? `<span class="idtag">${esc(r.id)}</span>` : ""}</div>
    <h3>${esc(r.name || "")}</h3>
    ${changes ? `<div>${inline(changes)}</div>` : ""}
    ${r.affects ? `<div class="who"><span class="muted">Affects:</span> ${inline(r.affects)}</div>` : ""}
    <div class="track" aria-label="Stage: ${esc(r.stage || "unknown")}">${STAGES.map((s, k) => `<span class="${idx >= k ? "done" : ""}"></span>`).join("")}</div>
    <div class="tracklabels">${STAGES.map((s, k) => `<span class="${k === idx ? "cur" : ""}">${esc(s)}</span>`).join("")}</div>
    ${flags ? `<div class="meta">${flags}</div>` : ""}
    <div class="meta">${linkHtml(r.officialLink && { url: r.officialLink, label: "Official text" }, 0)} ${linkHtml(r.newsLink && { url: r.newsLink, label: "News" }, 1)}${!compact && r.lastChecked ? `<span class="muted">Checked ${fmtD(r.lastChecked)}</span>` : ""}</div>
  </article>`;
}

function readingCard(r, id) {
  return `<article class="card">
    <div class="meta">${pchip(r.place)}${r.domain ? `<span class="muted">${esc(r.domain)}</span>` : ""}${r.language && r.language !== "English" ? `<span class="flag neutral">${esc(r.language)}</span>` : ""}</div>
    <h3>${safeUrl(r.url) ? `<a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener" style="color:inherit">${esc(r.title)}</a>` : esc(r.title)}</h3>
    <div class="small muted">${esc([r.reporter, r.outlet].filter(Boolean).join(" · "))}</div>
    ${r.why ? `<div class="small">${inline(r.why)}</div>` : ""}
    ${id && S.canWrite ? `<label class="check"><input type="checkbox" data-act="readToggle" data-id="${esc(id)}" ${r.read ? "checked" : ""}> I read it</label>
      <textarea id="note-${esc(id)}" data-keep="1" data-act="readNote" data-id="${esc(id)}" placeholder="One line on what you took from it">${esc(r.notes || "")}</textarea>` : ""}
  </article>`;
}

/* ---------- Lessons ---------- */
function vLessons() {
  const taught = S.lessons.filter(l => !l.review);
  const reviews = S.lessons.filter(l => l.review).sort((a, b) => String(b.dateTaught).localeCompare(String(a.dateTaught)));
  const byNum = {}; taught.forEach(l => byNum[String(l.num)] = l);
  const done = taught.filter(l => l.dateTaught).length;
  const revisit = taught.filter(l => l.understood === "revisit").length;
  const total = S.curriculum && arr(S.curriculum.units).reduce((n, u) => n + arr(u.lessons).length, 0);
  let h = `<div class="col"><div class="stats">
    <div class="stat"><div class="v">${done}${total ? `<span class="muted" style="font-size:1rem"> / ${total}</span>` : ""}</div><div class="l">lessons taught</div></div>
    <div class="stat"><div class="v">${streak()}</div><div class="l">day streak</div></div>
    <div class="stat"><div class="v">${revisit}</div><div class="l">marked to revisit</div></div></div>`;
  if (!taught.length && !S.curriculum) {
    return h + empty("Lessons start with the first daily run.", `<p>One short lesson a day, in order: how each government works, how rules get made, then the history of the US, Poland, Kraków and India, today's politics, and the relationships between them. Each one appears here once it's taught.</p>`) + `</div>`;
  }
  let nextMarked = false;
  const row = (num, title, l, key) => {
    key = key || String(num);
    let st = "later", lab = "Coming up";
    if (l && l.dateTaught) { st = l.understood === "revisit" ? "revisit" : "done"; lab = l.understood === "revisit" ? "Revisit" : fmtD(l.dateTaught, { day: "numeric", month: "short" }); }
    else if (!nextMarked) { st = "next"; lab = "Next"; nextMarked = true; }
    const open = S.ui.lessonOpen === key;
    return `<button class="lrow" data-act="lessonOpen" data-num="${esc(key)}" ${l && l.dateTaught ? "" : "disabled"} aria-expanded="${open}"><span class="num">${esc(num)}</span><span>${esc(title || (l && l.title) || "")}</span><span class="st ${st}">${esc(lab)}</span></button>${open && l ? lessonCard(l, l, false) : ""}`;
  };
  if (S.curriculum && arr(S.curriculum.units).length) {
    h += arr(S.curriculum.units).map(u => `<section class="unit"><h3>${esc(u.name)}</h3><div class="path">${arr(u.lessons).map(x => row(x.num, x.title, byNum[String(x.num)])).join("")}</div></section>`).join("");
  } else {
    const units = {}; taught.forEach(l => (units[l.unit || "Lessons"] = units[l.unit || "Lessons"] || []).push(l));
    h += Object.keys(units).map(u => `<section class="unit"><h3>${esc(u)}</h3><div class="path">${units[u].map(l => row(l.num, l.title, l)).join("")}</div></section>`).join("");
  }
  if (reviews.length) {
    h += `<section class="unit"><h3>Weekly reviews</h3><div class="path">${reviews.map(l => row("R", l.title, l, l._id)).join("")}</div></section>`;
  }
  return h + `</div>`;
}
function streak() {
  const days = new Set(S.lessons.filter(l => l.dateTaught).map(l => l.dateTaught));
  let n = 0; const d = new Date(); if (!days.has(isoDate(d))) d.setDate(d.getDate() - 1);
  while (days.has(isoDate(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- Timeline ---------- */
function vTimeline() {
  const f = S.ui.tl;
  const evs = allEvents();
  const threadsInUse = Array.from(new Set(evs.map(e => e.thread).filter(Boolean).concat(S.threads.map(t => t.name).filter(Boolean)))).sort();
  const q = f.q.trim().toLowerCase();
  const filtered = evs.filter(e => (!f.place || e.place === f.place) && (!f.domain || e.domain === f.domain) && (!f.tier || String(e.tier) === f.tier) && (!f.thread || e.thread === f.thread)
    && (!q || [e.text, e.outlet, e.reporter, e.thread, e.notes].join(" ").toLowerCase().includes(q)));
  let h = `<div class="filters">
    <div class="chips" aria-label="Place"><button class="chip" aria-pressed="${!f.place}" data-act="tl" data-k="place" data-v="">All places</button>${ALL_PLACES.map(p => `<button class="chip" aria-pressed="${f.place === p}" data-act="tl" data-k="place" data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div>
    <div class="frow">
      <select id="tlDomain" data-act="tlSel" data-k="domain" aria-label="Domain"><option value="">All domains</option>${DOMAINS.map(d => `<option ${f.domain === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <select id="tlTier" data-act="tlSel" data-k="tier" aria-label="Tier"><option value="">All tiers</option>${["1", "2", "3"].map(t => `<option value="${t}" ${f.tier === t ? "selected" : ""}>Tier ${t}</option>`).join("")}</select>
      <select id="tlThread" data-act="tlSel" data-k="thread" aria-label="Thread"><option value="">All threads</option>${threadsInUse.map(t => `<option ${f.thread === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <input type="search" id="tlSearch" data-act="tlSearch" placeholder="Search events" value="${esc(f.q)}" aria-label="Search events">
    </div>
    <div class="btnrow" style="justify-content:space-between"><span class="small muted">${filtered.length} of ${evs.length} events loaded · ${S.eventDays.length} days</span>
      <span class="btnrow">${S.dl ? `<button class="btn" data-act="exportCsv">Download as spreadsheet (CSV)</button>` : ""}${(f.place || f.domain || f.tier || f.thread || f.q) ? `<button class="btn" data-act="tlClear">Clear filters</button>` : ""}</span></div>
  </div>`;
  if (!evs.length) return h + empty("No events logged yet.", `<p>Every event from every brief lands here, all three tiers, with its sources. Filter by place, domain, tier or thread to follow a story over time.</p>`);
  const shown = filtered.slice(0, S.ui.tlShow);
  let lastDay = "";
  h += `<div class="panel">${shown.length ? shown.map(e => {
    let head = ""; const d = e.eventDate || e._day;
    if (e._day !== lastDay) { lastDay = e._day; head = `<h3 class="dayhead">${fmtLong(e._day)}</h3>`; }
    return head + itemHtml(Object.assign({}, e, { text: e.text + (e.eventDate && e.eventDate !== e._day ? ` <span class="muted small">(happened ${fmtD(e.eventDate, { day: "numeric", month: "short" })})</span>` : "") }), { place: true, domain: true });
  }).join("") : `<p class="muted" style="margin:0">No events match these filters.</p>`}</div>`;
  h += `<div class="btnrow" style="justify-content:center">${filtered.length > shown.length ? `<button class="btn" data-act="tlMore">Show more</button>` : ""}${!S.olderEventsDone && S.db ? `<button class="btn" data-act="tlOlder">Load older days</button>` : ""}</div>`;
  return h;
}

/* ---------- Rules ---------- */
function vRules() {
  const places = ["US", "Poland", "EU (applies in Poland)", "Kraków", "India"];
  const f = S.ui.rulesPlace;
  const list = S.rules.filter(r => !f || r.place === f);
  const rank = r => { const e = r.effectiveDate ? daysFrom(r.effectiveDate) : null; if (r.stage === "Struck down / withdrawn") return 9e6; if (e != null && e >= 0) return e; if (r.stage !== "In force") return 5e5; return 1e6 - (e || 0); };
  list.sort((a, b) => rank(a) - rank(b));
  let h = `<div class="chips"><button class="chip" aria-pressed="${!f}" data-act="rulesPlace" data-v="">All</button>${places.map(p => `<button class="chip" aria-pressed="${f === p}" data-act="rulesPlace" data-v="${esc(p)}">${esc(p)}</button>`).join("")}</div>`;
  if (!S.rules.length) return h + empty("No rules tracked yet.", `<p>Every new or changed law, agency rule, court ruling with policy effect and official guidance gets a card here: FDA rules, executive orders, Polish acts, EU rules that apply in Poland, Kraków council resolutions, Indian notifications and RBI or SEBI circulars. Each card shows its stage, who it affects, and countdowns to comment deadlines and effective dates.</p>`);
  const soon = list.filter(r => r.effectiveDate && daysFrom(r.effectiveDate) >= 0 && daysFrom(r.effectiveDate) <= 30).length;
  h += `<div class="small muted">${list.length} rules · ${soon} taking effect in the next 30 days</div>`;
  return h + `<div class="rules" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))">${list.map(r => ruleCard(r, false)).join("")}</div>`;
}

/* ---------- Watch ---------- */
function vWatch() {
  if (!S.watch.length) return `<div class="col">${empty("Nothing on the watch list yet.", `<p>Upcoming votes, decisions, deadlines and events land here with a countdown and the expected outcome. Once the date passes, you'll see what actually happened and judge whether the expectation held.</p>`)}</div>`;
  const due = S.watch.filter(w => daysFrom(w.checkDate) < 0 && (!w.status || w.status === "Open")).sort((a, b) => String(a.checkDate).localeCompare(String(b.checkDate)));
  const upcoming = S.watch.filter(w => daysFrom(w.checkDate) >= 0 && (!w.status || w.status === "Open")).sort((a, b) => String(a.checkDate).localeCompare(String(b.checkDate)));
  const resolved = S.watch.filter(w => w.status && w.status !== "Open");
  const card = (w, isDue) => `<article class="wcard ${isDue ? "due" : ""}">
    <div class="meta">${pchip(w.place)}${w.domain ? `<span class="muted">${esc(w.domain)}</span>` : ""}<span class="flag ${isDue ? "bad" : "neutral"}">${fmtD(w.checkDate)} · ${rel(daysFrom(w.checkDate))}</span>${w._id ? `<span class="idtag">${esc(w.id || w._id)}</span>` : ""}</div>
    <div><strong>${inline(w.what || "")}</strong></div>
    ${w.expected ? `<div class="small"><span class="muted">Expected:</span> ${inline(w.expected)}</div>` : ""}
    ${w.happened ? `<div class="small"><span class="muted">What happened:</span> ${inline(w.happened)}</div>` : (isDue ? `<div class="small muted">The next daily run will fill in what happened.</div>` : "")}
    ${(isDue || (w.status && w.status !== "Open")) && S.canWrite ? `<div class="verdicts">${WATCH_STATUS.map(s => `<button class="btn ${w.status === s ? "on" : ""}" data-act="verdict" data-id="${esc(w._id)}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
  </article>`;
  let h = `<div class="col">`;
  h += `<section class="sec"><h2>Your verdict needed <span class="count">${due.length}</span></h2>${due.length ? due.map(w => card(w, true)).join("") : `<p class="muted small" style="margin:0">Nothing waiting on you.</p>`}</section>`;
  h += `<section class="sec"><h2>Coming up <span class="count">${upcoming.length}</span></h2>${upcoming.length ? upcoming.map(w => card(w, false)).join("") : `<p class="muted small" style="margin:0">Nothing scheduled.</p>`}</section>`;
  if (resolved.length) {
    const tally = WATCH_STATUS.map(s => `${esc(s)}: <span class="mono">${resolved.filter(w => w.status === s).length}</span>`).join(" · ");

      const distinct = Object.keys(outlets).length; const topN = Math.max(0, ...Object.values(outlets)); const top = topN / c;

}
function customHow() { return S.site && S.site.howItWorks && String(S.site.howItWorks).trim() ? md(S.site.howItWorks) : ""; }

const E = { file: "", doc: null, loading: false, dirty: false, err: null, open: {}, needToken: false, tokErr: null, saving: false, savedMsg: "" };
const human = k => String(k).replace(/([a-z])([A-Z0-9])/g, "$1 $2").replace(/([0-9])([A-Z])/g, "$1 $2").replace(/[_]/g, " ").replace(/^./, c => c.toUpperCase());
const getAt = (o, p) => p.reduce((a, k) => a == null ? a : a[k], o);
function setAt(o, p, v) { const parent = getAt(o, p.slice(0, -1)); parent[p[p.length - 1]] = v; }
function preview(o) {
  if (o == null) return "";
  if (typeof o !== "object") return String(o).slice(0, 90);
  for (const k of ["title", "name", "text", "q", "what", "term", "aspect", "when", "side", "weekday", "segment", "area", "date", "id"]) if (o[k]) return String(o[k]).slice(0, 90);
  return "";
}
function blankLike(x) {
  if (Array.isArray(x)) return [];
  if (x && typeof x === "object") { const o = {}; for (const k in x) o[k] = blankLike(x[k]); return o; }
  if (typeof x === "number") return 0; if (typeof x === "boolean") return false; return "";
}
const LONG_KEY = /body|text|summary|why|explain|current|timeline|actors|issues|disputes|how|hook|matters|example|changes|affects|expected|happened|notes|desc|covers|answer|trackRecord|slant|focus|lean|view|meaning/i;
function fieldHtml(v, path, key) {
  const p = esc(JSON.stringify(path));
  const label = key != null && typeof key !== "number" ? `<label class="fl">${esc(human(key))}</label>` : "";
  if (v === null || v === undefined) v = "";
  if (typeof v === "string") {
    const long = v.length > 70 || v.includes("\n") || (LONG_KEY.test(String(key || "")) && (v.length === 0 || v.length > 40));
    const rows = Math.min(16, Math.max(2, Math.ceil(v.length / 85) + (v.match(/\n/g) || []).length));
    return `<div class="ff">${label}${long ? `<textarea data-epath="${p}" rows="${rows}">${esc(v)}</textarea>` : `<input data-epath="${p}" value="${esc(v)}">`}</div>`;
  }
  if (typeof v === "number") return `<div class="ff">${label}<input type="number" data-epath="${p}" data-num="1" value="${esc(v)}"></div>`;
  if (typeof v === "boolean") return `<div class="ff"><label class="chk2"><input type="checkbox" data-epath="${p}" ${v ? "checked" : ""}> ${esc(human(key))}</label></div>`;
  if (Array.isArray(v)) {
    if (v.length && v.every(x => typeof x === "string" || typeof x === "number")) return `<div class="ff">${label}<textarea data-epath="${p}" data-lines="1" rows="${Math.min(12, v.length + 1)}">${esc(v.join("\n"))}</textarea><div class="hint">One per line</div></div>`;
    return `<div class="ff">${label}<div class="arr">${v.map((it, i) => {
      const pp = path.concat(i), k = JSON.stringify(pp), open = !!E.open[k];
      return `<div class="ai"><div class="aih"><button class="aibtn" data-act="eToggle" data-k="${esc(k)}" aria-expanded="${open}">${open ? "▾" : "▸"} ${esc(preview(it) || ((key != null && typeof key !== "number" ? human(key) : "Item") + " " + (i + 1)))}</button>
        <span class="btnrow"><button class="btn small" data-act="eMove" data-epath="${p}" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button><button class="btn small" data-act="eMove" data-epath="${p}" data-i="${i}" data-d="1" ${i === v.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button><button class="btn small" data-act="eDel" data-epath="${p}" data-i="${i}">Remove</button></span></div>
        ${open ? `<div class="aib">${typeof it === "object" && it !== null ? fieldHtml(it, pp, null) : fieldHtml(it, pp, "value")}</div>` : ""}</div>`;
    }).join("")}<div><button class="btn small" data-act="eAdd" data-epath="${p}" data-key="${esc(key == null ? "" : key)}">+ Add</button></div></div></div>`;
  }
  const inner = Object.keys(v).map(k => fieldHtml(v[k], path.concat(k), k)).join("");
  return key != null && typeof key !== "number" ? `<fieldset class="fs"><legend>${esc(human(key))}</legend>${inner}<div><button class="btn small" data-act="eAddField" data-epath="${p}">+ Add a field</button></div></fieldset>` : inner;
}
function editFiles() {
  const f = [["site.json", "Page text & setup"]];
  S.briefs.forEach(b => f.push(["briefs/" + b.date + ".json", "Brief · " + fmtD(b.date)]));
  S.eventDays.slice(0, 21).forEach(d => f.push(["events/" + d.date + ".json", "Event log · " + fmtD(d.date)]));
  EDIT_FILES.forEach(x => f.push(x));
  S.weekly.forEach(w => f.push(["weekly/" + w.weekStart + ".json", "Sunday · week of " + fmtD(w.weekStart)]));
  return f;
}
function vEdit() {
  const files = editFiles();
  let h = `<div class="col"><div class="datebar"><div><p class="when">Edit</p><div class="small muted">Changes are published to your site on GitHub for everyone. They appear about a minute after saving.</div></div>
    ${lsGet(TOK_KEY) ? `<button class="btn" data-act="forgetTok">Forget my GitHub key on this device</button>` : ""}</div>
    <div class="panel" style="display:grid;gap:10px"><label class="fl" for="eFile">What do you want to edit?</label>
      <select id="eFile" data-act="eFile"><option value="">Choose…</option>${files.map(([p, l]) => `<option value="${esc(p)}" ${E.file === p ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>
      ${E.file && /^(briefs|events)\//.test(E.file) ? `<div class="hint">Briefs and event logs are separate files. To correct an event everywhere, edit it in both.</div>` : ""}
      ${E.file === "site.json" ? `<div class="hint">${esc(SETUP_HINT)}</div>` : ""}
    </div>`;
  if (E.needToken) h += tokenPanel();
  if (E.loading) h += `<p class="muted">Loading…</p>`;
  else if (E.err) h += `<div class="banner">${esc(E.err)}</div>`;
  else if (E.doc) {
    h += `<div class="panel editform">${fieldHtml(E.doc, [], null)}</div>
      <div class="savebar"><span class="small muted">${E.dirty ? "Unsaved changes" : (E.savedMsg || "No changes yet")}</span><span class="btnrow"><button class="btn" data-act="eDiscard" ${E.dirty ? "" : "disabled"}>Discard changes</button><button class="btn primary" data-act="eSave" ${E.dirty && !E.saving ? "" : "disabled"}>${E.saving ? "Publishing…" : "Save and publish"}</button></span></div>`;
  }
  return h + `</div>`;
}
function tokenPanel() {
  return `<div class="panel tokpanel"><strong>Connect GitHub to publish</strong>
    <p class="small">Saving writes to <code>${esc(GH.owner)}/${esc(GH.repo)}</code> on GitHub. Paste your GitHub key (a fine-grained personal access token with Contents: Read and write on this repository). It's the same key World Desk uses. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one on GitHub</a></p>
    <label class="fl" for="tok">GitHub key</label><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
    <label class="chk2"><input type="checkbox" id="tokRemember" checked> Remember on this device</label>
    ${E.tokErr ? `<div class="err">${esc(E.tokErr)}</div>` : ""}
    <div class="btnrow"><button class="btn primary" data-act="tokSave">Save and publish</button><button class="btn" data-act="tokCancel">Not now</button></div></div>`;
}
async function eLoad(p) {
  E.file = p; E.doc = null; E.err = null; E.dirty = false; E.open = {}; E.savedMsg = "";
  if (!p) { render(); return; }
  E.loading = true; render();
  let obj = await ghRead(p);
  if (obj == null) obj = p === "site.json" ? JSON.parse(JSON.stringify(DEFAULT_SITE)) : null;
  else if (p === "site.json") obj = mergeSite(obj);
  E.loading = false;
  if (obj == null) E.err = "This file doesn't exist yet. The daily runs create it the first time they have something to put in it.";
  else E.doc = obj;
  render();
}
async function eSave(token) {
  token = token || lsGet(TOK_KEY);
  if (!token) { E.needToken = true; render(); const t = document.getElementById("tok"); if (t) t.focus(); return; }
  E.saving = true; render();
  try {
    await ghWrite(token, E.file, E.doc, "Edit " + repoPath(E.file) + " from the page");
    if (E.remember) lsSet(TOK_KEY, token);
    recentSet(E.file, JSON.parse(JSON.stringify(E.doc)));
    applyFile(E.file, JSON.parse(JSON.stringify(E.doc)));
    E.dirty = false; E.needToken = false; E.tokErr = null; E.savedMsg = "Published. Everyone sees it within a minute or two."; toast("Published");
  } catch (e) {
    const st = e && e.status;
    E.tokErr = st === 401 ? "GitHub didn't accept that key. Check that it was copied in full and hasn't expired."
      : (st === 403 || st === 404) ? `That key can't change this site. It needs "Contents: Read and write" on ${GH.owner}/${GH.repo}.`
      : st === 409 ? "The file changed on GitHub at the same moment, probably a daily run. Discard, reopen the file and make your change again."
      : "Couldn't reach GitHub. Check your connection and try again.";
    if (st === 401 || st === 403 || st === 404) { lsSet(TOK_KEY, null); E.needToken = true; }
    if (!E.needToken) E.err = null;
    toast("Not saved yet");
  }
  E.saving = false; render();
}
function applyFile(p, obj) {
  if (p === "site.json") { S.site = mergeSite(obj); applySite(); }
  else if (p.startsWith("briefs/")) S.briefs = mergeBy([obj], S.briefs.filter(b => b.date !== obj.date), "date");
  else if (p.startsWith("events/")) S.eventDays = mergeBy([obj], S.eventDays.filter(b => b.date !== obj.date), "date");
  else if (p.startsWith("weekly/")) S.weekly = [obj].concat(S.weekly.filter(w => w.weekStart !== obj.weekStart)).sort((a, b) => String(b.weekStart).localeCompare(String(a.weekStart)));
  else if (p === "curriculum.json") S.curriculum = obj;
  else { const c = p.replace(/\.json$/, ""); if (Array.isArray(S[c])) { S[c] = overlay(c, itemsOf(obj)); if (typeof afterSingles === "function") afterSingles(); } }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "eToggle") { E.open[el.dataset.k] = !E.open[el.dataset.k]; render(); }
  else if (a === "eDel" || a === "eMove" || a === "eAdd" || a === "eAddField") {
    const path = JSON.parse(el.dataset.epath), arr = getAt(E.doc, path), i = +el.dataset.i;
    if (a === "eDel") arr.splice(i, 1);
    else if (a === "eMove") { const j = i + (+el.dataset.d); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    else if (a === "eAdd") { const tpl = arr.length ? blankLike(arr[0]) : (ADD_TEMPLATES[el.dataset.key] ? JSON.parse(JSON.stringify(ADD_TEMPLATES[el.dataset.key])) : ""); arr.push(tpl); E.open[JSON.stringify(path.concat(arr.length - 1))] = true; }
    else if (a === "eAddField") { let n = Object.keys(arr).length + 1; while (("newField" + n) in arr) n++; arr["newField" + n] = ""; }
    E.dirty = true; render();
  }
  else if (a === "eDiscard") eLoad(E.file);
  else if (a === "eSave") { E.remember = true; eSave(); }
  else if (a === "tokSave") { const t = document.getElementById("tok"), v = t ? t.value.trim() : ""; const r = document.getElementById("tokRemember"); E.remember = !r || r.checked; if (!v) { E.tokErr = "Paste your GitHub key first."; render(); return; } E.tokErr = null; eSave(v); }
  else if (a === "tokCancel") { E.needToken = false; E.tokErr = null; render(); }
  else if (a === "forgetTok") { lsSet(TOK_KEY, null); toast("GitHub key removed from this device"); render(); }
});
document.addEventListener("change", e => { const el = e.target; if (el.dataset && el.dataset.act === "eFile") { if (E.dirty && !el.dataset.confirmed) { /* switching discards unsaved edits */ } eLoad(el.value); } });
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.epath || !E.doc) return;
  const path = JSON.parse(el.dataset.epath);
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.num) v = el.value === "" ? 0 : Number(el.value);
  if (el.dataset.lines) v = el.value.split("\n").map(x => x.trim()).filter(Boolean);
  if (path.length === 0) return;
  setAt(E.doc, path, v);
  if (!E.dirty) { E.dirty = true; const sb = document.querySelector(".savebar"); if (sb) { const m = sb.querySelector(".small"); if (m) m.textContent = "Unsaved changes"; sb.querySelectorAll("button").forEach(b => b.disabled = false); } }
});

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act;
  if (a === "place") { S.ui.place = el.dataset.place; render(); }
  else if (a === "older") {
    el.disabled = true;
    if (S.briefIdx >= todayDates().length - 1) await loadOlderBriefs();
    if (S.briefIdx < todayDates().length - 1) S.briefIdx++;
    // make sure the brief for the day being shown is loaded
    let guard = 0;
    while (!S.olderBriefsDone && S.briefs.length && guard++ < 20 && todayDates()[S.briefIdx] < S.briefs[S.briefs.length - 1].date) await loadOlderBriefs();
    render();
  }
  else if (a === "lcheck") { const m = S.ui.lq[el.dataset.key] = S.ui.lq[el.dataset.key] || {}; m[el.dataset.k] = +el.dataset.j; render(); }
  else if (a === "newer") { S.briefIdx = Math.max(0, S.briefIdx - 1); render(); }
  else if (a === "understood") { const v = el.dataset.v; write("lessons/" + el.dataset.id, r => r.update({ understood: v })); toast(v === "got" ? "Marked as understood" : "Marked to revisit"); }
  else if (a === "lessonOpen") { S.ui.lessonOpen = S.ui.lessonOpen === el.dataset.num ? null : el.dataset.num; render(); }
  else if (a === "thread") { S.ui.tl = { place: "", domain: "", tier: "", thread: el.dataset.thread, q: "" }; S.ui.tlShow = 50; location.hash = "#timeline"; }
  else if (a === "tl") { S.ui.tl[el.dataset.k] = el.dataset.v; S.ui.tlShow = 20; render(); }
  else if (a === "tlClear") { S.ui.tl = { place: "", domain: "", tier: "", thread: "", q: "" }; render(); }
  else if (a === "tlMore") { S.ui.tlShow += 30; render(); }
  else if (a === "tlOlder") { el.disabled = true; await loadOlderEvents(30); render(); }
  else if (a === "exportCsv") exportCsv();
  else if (a === "rulesPlace") { S.ui.rulesPlace = el.dataset.v; render(); }
  else if (a === "verdict") { const v = el.dataset.v; write("watch/" + el.dataset.id, r => r.update({ status: v, judgedOn: todayIso() })); toast("Verdict saved"); }
  else if (a === "readFilter") { S.ui.readFilter = el.dataset.v; render(); }
  else if (a === "answer") {
    const ws = S.ui.week; const k = el.dataset.k; const mine = S.mine["week-" + ws] || {};
    const answers = Object.assign({}, mine.answers || {}); answers[k] = +el.dataset.j;
    S.mine["week-" + ws] = Object.assign({}, mine, { answers }); render();
    upsert("mine/week-" + ws, { answers, weekStart: ws });
  }
  else if (a === "saveSyn") {
    const ws = S.ui.week; const mine = S.mine["week-" + ws] || {};
    const synthesis = JSON.parse(JSON.stringify(mine.synthesis || {}));
    const d = S.ui.synDraft[ws] || {}; Object.keys(d).forEach(ar => synthesis[ar] = Object.assign({}, synthesis[ar] || {}, d[ar]));
    await upsert("mine/week-" + ws, { synthesis, weekStart: ws, savedAt: Date.now() });
    delete S.ui.synDraft[ws]; toast("Synthesis saved"); render();
  }
  else if (a === "covDays") {
    S.ui.covDays = +el.dataset.v; render();
    const from = isoDate(new Date(parseD(todayIso()).getTime() - (S.ui.covDays - 1) * 86400000));
    while (S.eventDays.length && S.eventDays[S.eventDays.length - 1].date > from && !S.olderEventsDone) { if (!(await loadOlderEvents(30))) break; }
    render();
  }
  else if (a === "libTab") { S.ui.libTab = el.dataset.v; render(); }
  else if (a === "srcPlace") { S.ui.srcPlace = el.dataset.v; render(); }
});
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "briefRead") { const d = el.dataset.date; const v = el.checked; upsert("mine/day-" + d, { briefRead: v, date: d }); toast(v ? "Nice. See you tomorrow." : "Unmarked"); }
  else if (a === "readToggle") { const v = el.checked; write("reading/" + el.dataset.id, r => r.update({ read: v, readOn: v ? todayIso() : null })); }
  else if (a === "tlSel") { S.ui.tl[el.dataset.k] = el.value; S.ui.tlShow = 20; render(); }
  else if (a === "weekSel") { S.ui.week = el.value; render(); }
});
document.addEventListener("input", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "tlSearch") { S.ui.tl.q = el.value; S.ui.tlShow = 20; clearTimeout(vTimeline._t); vTimeline._t = setTimeout(render, 200); }
  else if (a === "syn") { const ws = S.ui.week; const d = S.ui.synDraft[ws] = S.ui.synDraft[ws] || {}; (d[el.dataset.area] = d[el.dataset.area] || {})[el.dataset.f] = el.value; }
});
document.addEventListener("focusout", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "readNote") { const v = el.value; const cur = (S.reading.find(r => r._id === el.dataset.id) || {}).notes || ""; if (v !== cur) { write("reading/" + el.dataset.id, r => r.update({ notes: v })); toast("Note saved"); } setTimeout(render, 0); }
  else if (a === "lessonNote") { const v = el.value; const cur = (S.lessons.find(r => r._id === el.dataset.id) || {}).notes || ""; if (v !== cur) { write("lessons/" + el.dataset.id, r => r.update({ notes: v })); toast("Note saved"); } setTimeout(render, 0); }
  else if (a === "syn") setTimeout(render, 0);
});

async function exportCsv() {
  if (!S.dl) return;
  const cols = ["id", "dateLogged", "eventDate", "place", "domain", "text", "tier", "verification", "reporter", "outlet", "language", "link1", "link2", "archive", "paywalled", "thread", "followsUp", "notes"];
  const q = v => { const s = Array.isArray(v) ? v.map(x => x && x.url ? x.url : x).join(" ") : String(v == null ? "" : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = allEvents().map(e => cols.map(c => q(c === "dateLogged" ? (e.dateLogged || e._day) : e[c])).join(","));
  try { await S.dl.save({ filename: `events-${todayIso()}.csv`, data: "﻿" + cols.join(",") + "\n" + rows.join("\n") }); toast("Saved"); }
  catch (err) { if (err && err.code !== "declined") toast("Couldn't save the file here."); }
}

boot();
})();
