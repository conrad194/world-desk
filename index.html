<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>World Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Bitter:wght@600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a front door. Date and title on top, then large doors (cards) that wrap to one column on phones, then the routine. Edit mode turns each block into a form in place. */
:root {
  --bg: #E9ECEE;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --ink: #18202A;
  --muted: #5A6570;
  --line: #D4DAE0;
  --focus: #2B4F9E;
  --c-teal: #0D6B5B;   --s-teal: #DCEFEA;
  --c-wine: #8C2F39;   --s-wine: #F3E2E4;
  --c-blue: #2B4F9E;   --s-blue: #E3E9F6;
  --c-amber: #A0660E;  --s-amber: #F5EAD6;
  --c-green: #3F7D2E;  --s-green: #E2F0DC;
  --c-violet: #6A4EA3; --s-violet: #ECE6F6;
  --c-slate: #4F5B6A;  --s-slate: #E4E8ED;
  --us: #2B4F9E; --pl: #BE2B3A; --in: #C9650E;
  --g1: #3A5A8C; --g2: #A0660E; --g3: #0F7A73; --g4: #3F7D2E; --g5: #B0502A; --g6: #7350A3; --g7: #4F5B6A;
  --danger: #B3261E;
  --f-display: "Newsreader", Georgia, serif;
  --f-alt: "Bitter", Georgia, serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1419; --surface: #171E26; --surface-2: #1D2630; --ink: #E5EAF0; --muted: #94A0AD; --line: #2A3440; --focus: #8FAEF0;
    --c-teal: #4CC2A6; --s-teal: #163A33; --c-wine: #E88A95; --s-wine: #3B1E23; --c-blue: #8FAEF0; --s-blue: #1D2A45;
    --c-amber: #E6B567; --s-amber: #392C15; --c-green: #8CCB78; --s-green: #1D3317; --c-violet: #BCA6EE; --s-violet: #2A2240;
    --c-slate: #AAB6C4; --s-slate: #252C35;
    --us: #8FAEF0; --pl: #F08A95; --in: #F2A45C;
    --g1: #94B2E4; --g2: #E6B567; --g3: #5CC9BF; --g4: #8CCB78; --g5: #EE9A76; --g6: #BCA1EA; --g7: #AAB6C4;
    --danger: #F2948C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1419; --surface: #171E26; --surface-2: #1D2630; --ink: #E5EAF0; --muted: #94A0AD; --line: #2A3440; --focus: #8FAEF0;
  --c-teal: #4CC2A6; --s-teal: #163A33; --c-wine: #E88A95; --s-wine: #3B1E23; --c-blue: #8FAEF0; --s-blue: #1D2A45;
  --c-amber: #E6B567; --s-amber: #392C15; --c-green: #8CCB78; --s-green: #1D3317; --c-violet: #BCA6EE; --s-violet: #2A2240;
  --c-slate: #AAB6C4; --s-slate: #252C35;
  --us: #8FAEF0; --pl: #F08A95; --in: #F2A45C;
  --g1: #94B2E4; --g2: #E6B567; --g3: #5CC9BF; --g4: #8CCB78; --g5: #EE9A76; --g6: #BCA1EA; --g7: #AAB6C4;
  --danger: #F2948C;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; display: grid; gap: 28px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.date { font-family: var(--f-mono); font-size: 0.85rem; color: var(--muted); }
header { display: grid; gap: 6px; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.1; margin: 0; letter-spacing: -0.015em; text-wrap: balance; }
.lede { color: var(--muted); max-width: 60ch; margin: 0; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.btn:hover:not(:disabled) { border-color: var(--focus); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 10px; font-size: 0.82rem; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; }
.door { display: grid; gap: 16px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 20px; text-decoration: none; color: inherit; transition: border-color 0.15s, transform 0.15s; min-width: 0; }
a.door:hover { border-color: var(--c); }
a.door:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) { a.door:hover { transform: translateY(-2px); } }
.mark { height: 6px; display: flex; gap: 3px; }
.mark span { flex: 1; border-radius: 3px; }
.door h2 { margin: 0; font-size: 1.75rem; line-height: 1.15; font-family: var(--f-display); font-weight: 600; overflow-wrap: anywhere; }
.door.alt h2 { font-family: var(--f-alt); font-weight: 700; }
.door p { margin: 0; color: var(--muted); }
.today { background: var(--cs); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; }
.today b { font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--c); }
.today div { font-weight: 600; }
.today small { color: var(--muted); font-size: 0.85rem; }
ul.has { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
ul.has li { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.82rem; color: var(--muted); }
.go { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; color: var(--c); }
.go::after { content: "→"; }

.routine { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; display: grid; gap: 10px; }
.routine h3 { margin: 0; font-size: 0.78rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.routine ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.routine .when { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); }

/* Edit mode */
.editing .door { border-style: dashed; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
.field input, .field textarea, .field select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
.field textarea { min-height: 64px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; background: var(--c); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.cardtools { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }
.rrow { display: grid; grid-template-columns: 1fr 130px auto; gap: 8px; align-items: center; }
@media (max-width: 560px) { .rrow { grid-template-columns: 1fr; } }
.editbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.editbar .msg { font-size: 0.88rem; color: var(--muted); }
.err { color: var(--danger); font-size: 0.82rem; }
.addcard { border: 1px dashed var(--line); border-radius: 14px; background: transparent; padding: 22px; cursor: pointer; color: var(--muted); font-weight: 600; min-height: 120px; }
.addcard:hover { border-color: var(--focus); color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 0.9rem; z-index: 20; }
.tokpanel { background: var(--surface); border: 1px solid var(--focus); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
.tokpanel p { margin: 0; }
.small { font-size: 0.88rem; color: var(--muted); }
.tokpanel code { font-family: var(--f-mono); font-size: 0.85rem; overflow-wrap: anywhere; }
.chk { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.chk input { width: 18px; height: 18px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--focus); text-decoration: underline; cursor: pointer; font-size: inherit; }
.confirm { background: var(--surface-2); border: 1px solid var(--danger); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
</style>
</head>
<body>
<!--
  WORLD DESK, standalone copy for GitHub Pages.
  To change the title, cards, links or routine, edit the DEFAULT block
  in the script near the bottom of this file (search for "const DEFAULT").
  The Edit page button saves changes to data/desk.json in this repository.
-->


<div class="wrap" id="root"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
"use strict";
const COLORS = ["teal", "wine", "blue", "amber", "green", "violet", "slate"];
const TODAY_TYPES = { none: "Nothing", window: "Three-Country Window deep dive", rotation: "Geopolitics Rotation region", custom: "My own text" };
const MARKS = { solid: "Solid color", countries: "US · Poland · India", regions: "Seven regions (today highlighted)" };
const DEEP = ["Law, courts & regulation", "Economy, markets, trade & tariffs", "Health, medicine, food safety & science", "Technology, AI & cyber", "Foreign relations & defense: the three relationships", "Society, environment & infrastructure", "Kraków deep dive, culture, media & sport"];
const SEGS = ["Russia–Ukraine & European security", "Middle East", "East & Southeast Asia", "The Americas", "Africa", "South & Central Asia", "EU politics + cross-cutting"];
const DEFAULT = {
  title: "World Desk",
  lede: "Two daily briefings in one place: the countries closest to you every day, and the whole world one region at a time.",
  cards: [
    { id: "c1", name: "Three-Country Window", url: "window.html", desc: "The US, Poland, Kraków and India: every topic, every day, from politics and courts to FDA rules, tech and transport, plus how the three countries relate.", color: "teal", font: "display", mark: "countries", todayType: "window", todayText: "", note: "Opens with a civics lesson on how the three countries work.", chips: "Lessons, Rules & laws, Timeline, Coverage map, Sunday quiz", cta: "Open the Window" },
    { id: "c2", name: "Geopolitics Rotation", url: "rotation.html", desc: "The world in seven regions, one in depth each day, plus a daily check for anything major everywhere else.", color: "wine", font: "alt", mark: "regions", todayType: "rotation", todayText: "", note: "With the history behind one of the day's biggest stories.", chips: "History, Timeline, Watch list, Reporters, Sunday quiz", cta: "Open the Rotation" }
  ],
  routineTitle: "Your daily routine",
  routine: [
    { text: "Read the Window's lesson and Top 5.", when: "about 8 min" },
    { text: "Read the Rotation's Tier 1 summary and the history behind it.", when: "about 7 min" },
    { text: "Read one \"Read in full\" piece, and give verdicts on any Watch items that are due.", when: "" },
    { text: "On Sundays, take both quizzes and write your weekly synthesis.", when: "" }
  ]
};

const S = { db: null, canWrite: true, data: clone(DEFAULT), draft: null, editing: false, saving: false, confirmDel: null, confirmReset: false, loaded: false };
function clone(o) { return JSON.parse(JSON.stringify(o)); }
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => { u = String(u == null ? "" : u).trim(); if (/^https:\/\/\S+$/i.test(u)) return u; if (u && !/[:\s<>"]/.test(u)) return u; return ""; };
const wd = () => (new Date().getDay() + 6) % 7;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function colorVars(c) { c = COLORS.includes(c) ? c : "slate"; return `--c: var(--c-${c}); --cs: var(--s-${c});`; }
function markHtml(m) {
  if (m === "countries") return `<div class="mark" aria-hidden="true"><span style="background:var(--us)"></span><span style="background:var(--pl)"></span><span style="background:var(--in)"></span></div>`;
  if (m === "regions") return `<div class="mark" aria-hidden="true">${[1, 2, 3, 4, 5, 6, 7].map((n, i) => `<span style="background:var(--g${n});opacity:${i === wd() ? 1 : 0.35}"></span>`).join("")}</div>`;
  return `<div class="mark" aria-hidden="true"><span style="background:var(--c)"></span></div>`;
}
function todayLine(c) {
  if (c.todayType === "window") return "Deep dive: " + DEEP[wd()];
  if (c.todayType === "rotation") return "Region in focus: " + SEGS[wd()];
  if (c.todayType === "custom") return c.todayText || "";
  return "";
}
const chipList = s => String(s || "").split(",").map(x => x.trim()).filter(Boolean);

/* ---------- View mode ---------- */
function viewHtml(d) {
  const date = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return `<div class="topbar"><div class="date">${esc(date)}</div>${S.canWrite ? `<button class="btn" data-act="edit">Edit page</button>` : ""}</div>
  <header><h1>${esc(d.title)}</h1>${d.lede ? `<p class="lede">${esc(d.lede)}</p>` : ""}</header>
  ${d.cards.length ? `<div class="doors">${d.cards.map(c => {
    const url = safeUrl(c.url); const tl = todayLine(c); const chips = chipList(c.chips);
    const inner = `${markHtml(c.mark)}<h2>${esc(c.name)}</h2>${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
      ${tl || c.note ? `<div class="today"><b>Today</b>${tl ? `<div>${esc(tl)}</div>` : ""}${c.note ? `<small>${esc(c.note)}</small>` : ""}</div>` : ""}
      ${chips.length ? `<ul class="has">${chips.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${url ? `<span class="go">${esc(c.cta || "Open")}</span>` : `<span class="err">This card has no link yet.</span>`}`;
    return url ? `<a class="door ${c.font === "alt" ? "alt" : ""}" style="${colorVars(c.color)}" href="${esc(url)}" rel="noopener">${inner}</a>`
               : `<div class="door ${c.font === "alt" ? "alt" : ""}" style="${colorVars(c.color)}">${inner}</div>`;
  }).join("")}</div>` : `<p class="lede">No cards yet. Use Edit page to add one.</p>`}
  ${d.routine.length ? `<section class="routine"><h3>${esc(d.routineTitle || "Your daily routine")}</h3><ol>${d.routine.map(r => `<li>${esc(r.text)}${r.when ? ` <span class="when">${esc(r.when)}</span>` : ""}</li>`).join("")}</ol></section>` : ""}`;
}

/* ---------- Edit mode ---------- */
function editHtml(d) {
  const sel = (id, opts, v) => `<select id="${id}">${Object.entries(opts).map(([k, l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  return `<div class="editbar"><span class="msg">Editing. Save publishes your changes to the site for everyone.${lsGet(TOK_KEY) ? ` <button class="linkbtn" data-act="forgetTok">Forget my GitHub key on this device</button>` : ""}</span>
    <span class="btnrow">${S.confirmReset ? `<span class="confirm">Put everything back to the original layout? <button class="btn small danger" data-act="resetYes">Reset</button><button class="btn small" data-act="resetNo">Keep my changes</button></span>` : `<button class="btn" data-act="reset">Reset to original</button>`}
    <button class="btn" data-act="cancel">Cancel</button><button class="btn primary" data-act="save" ${S.saving ? "disabled" : ""}>${S.saving ? "Saving…" : "Save"}</button></span></div>
  ${S.needToken ? `<div class="tokpanel">
    <strong>Connect GitHub to publish</strong>
    <p class="small">Saving writes your changes to <code>${esc(REPO.owner)}/${esc(REPO.repo)}</code> on GitHub. Paste a GitHub key (a "fine-grained personal access token") that can change this repository. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create one on GitHub</a></p>
    <div class="field"><label for="tok">GitHub key</label><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></div>
    <label class="chk"><input type="checkbox" id="tokRemember" checked> Remember on this device</label>
    ${S.tokErr ? `<div class="err">${esc(S.tokErr)}</div>` : ""}
    <div class="btnrow"><button class="btn primary" data-act="tokSave" ${S.saving ? "disabled" : ""}>${S.saving ? "Publishing…" : "Save and publish"}</button><button class="btn" data-act="tokCancel">Not now</button></div>
  </div>` : ""}
  <header class="grid2" style="grid-template-columns:1fr">
    <div class="field"><label for="f-title">Page title</label><input id="f-title" data-k="title" value="${esc(d.title)}" maxlength="80"></div>
    <div class="field"><label for="f-lede">Intro line</label><textarea id="f-lede" data-k="lede" maxlength="300">${esc(d.lede)}</textarea></div>
  </header>
  <div class="doors">${d.cards.map((c, i) => `<div class="door ${c.font === "alt" ? "alt" : ""}" style="${colorVars(c.color)}">
      ${markHtml(c.mark)}
      <div class="field"><label for="n-${i}">Name</label><input id="n-${i}" data-c="${i}" data-f="name" value="${esc(c.name)}" maxlength="60"></div>
      <div class="field"><label for="u-${i}">Link (https://… or a page on this site, e.g. window.html)</label><input id="u-${i}" data-c="${i}" data-f="url" value="${esc(c.url)}" inputmode="url">${c.url && !safeUrl(c.url) ? `<span class="err">Use a full https:// link or a page on this site</span>` : ""}</div>
      <div class="field"><label for="d-${i}">Description</label><textarea id="d-${i}" data-c="${i}" data-f="desc" maxlength="300">${esc(c.desc)}</textarea></div>
      <div class="grid2">
        <div class="field"><label for="t-${i}">"Today" line shows</label>${sel("t-" + i, TODAY_TYPES, c.todayType).replace("<select", `<select data-c="${i}" data-f="todayType"`)}</div>
        ${c.todayType === "custom" ? `<div class="field"><label for="tt-${i}">Your text</label><input id="tt-${i}" data-c="${i}" data-f="todayText" value="${esc(c.todayText)}" maxlength="120"></div>` : ""}
        <div class="field"><label for="no-${i}">Small note under it</label><input id="no-${i}" data-c="${i}" data-f="note" value="${esc(c.note)}" maxlength="140"></div>
      </div>
      <div class="field"><label for="ch-${i}">Tags (separated by commas)</label><input id="ch-${i}" data-c="${i}" data-f="chips" value="${esc(c.chips)}" maxlength="200"></div>
      <div class="grid2">
        <div class="field"><label for="cta-${i}">Button text</label><input id="cta-${i}" data-c="${i}" data-f="cta" value="${esc(c.cta)}" maxlength="40"></div>
        <div class="field"><label for="m-${i}">Stripe at the top</label>${sel("m-" + i, MARKS, c.mark).replace("<select", `<select data-c="${i}" data-f="mark"`)}</div>
        <div class="field"><label for="fo-${i}">Title font</label>${sel("fo-" + i, { display: "Serif (Window style)", alt: "Slab (Rotation style)" }, c.font).replace("<select", `<select data-c="${i}" data-f="font"`)}</div>
      </div>
      <div class="field"><label>Color</label><div class="swatches">${COLORS.map(k => `<button class="sw" style="${colorVars(k)}" aria-label="${k}" aria-pressed="${c.color === k}" data-act="color" data-c="${i}" data-v="${k}"></button>`).join("")}</div></div>
      <div class="cardtools"><span class="btnrow"><button class="btn small" data-act="up" data-c="${i}" ${i === 0 ? "disabled" : ""}>Move up</button><button class="btn small" data-act="down" data-c="${i}" ${i === d.cards.length - 1 ? "disabled" : ""}>Move down</button></span>
        ${S.confirmDel === i ? `<span class="confirm">Remove this card? <button class="btn small danger" data-act="delYes" data-c="${i}">Remove</button><button class="btn small" data-act="delNo">Keep</button></span>` : `<button class="btn small danger" data-act="del" data-c="${i}">Remove card</button>`}</div>
    </div>`).join("")}
    <button class="addcard" data-act="add">+ Add a card</button>
  </div>
  <section class="routine">
    <div class="field"><label for="f-rt">Section title</label><input id="f-rt" data-k="routineTitle" value="${esc(d.routineTitle)}" maxlength="60"></div>
    ${d.routine.map((r, i) => `<div class="rrow"><input id="r-${i}" data-r="${i}" data-f="text" value="${esc(r.text)}" aria-label="Step ${i + 1}" maxlength="200"><input id="rw-${i}" data-r="${i}" data-f="when" value="${esc(r.when)}" placeholder="e.g. 5 min" aria-label="Time for step ${i + 1}" maxlength="30">
      <span class="btnrow"><button class="btn small" data-act="rup" data-r="${i}" ${i === 0 ? "disabled" : ""} aria-label="Move step up">↑</button><button class="btn small" data-act="rdown" data-r="${i}" ${i === d.routine.length - 1 ? "disabled" : ""} aria-label="Move step down">↓</button><button class="btn small danger" data-act="rdel" data-r="${i}">Remove</button></span></div>`).join("")}
    <div><button class="btn small" data-act="radd">+ Add a step</button></div>
  </section>`;
}

function render() {
  const root = $("#root");
  const fid = document.activeElement && document.activeElement.id;
  root.classList.toggle("editing", S.editing);
  root.innerHTML = S.editing ? editHtml(S.draft) : viewHtml(S.data);
  if (fid) { const el = document.getElementById(fid); if (el && el.focus) { el.focus(); if (el.setSelectionRange && typeof el.value === "string" && el.type !== "url") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } } }
}

/* ---------- Data ---------- */
function normalize(x) {
  const d = Object.assign(clone(DEFAULT), x || {});
  d.cards = Array.isArray(d.cards) ? d.cards.map(c => Object.assign({ id: "c" + Math.random().toString(36).slice(2, 8), name: "", url: "", desc: "", color: "slate", font: "display", mark: "solid", todayType: "none", todayText: "", note: "", chips: "", cta: "Open" }, c)) : clone(DEFAULT.cards);
  d.routine = Array.isArray(d.routine) ? d.routine.map(r => ({ text: String(r.text || ""), when: String(r.when || "") })) : clone(DEFAULT.routine);
  return d;
}
const REPO = (() => {
  const h = location.hostname, seg = location.pathname.split("/").filter(Boolean)[0];
  if (/\.github\.io$/i.test(h)) { const owner = h.split(".")[0]; return { owner, repo: seg && !/\.html$/i.test(seg) ? seg : owner + ".github.io" }; }
  return { owner: "conrad194", repo: "world-desk" };
})();
const CFG_PATH = "data/desk.json", BRANCH = "main", TOK_KEY = "worlddesk:token", CACHE_KEY = "worlddesk:desk";
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
async function boot() {
  render();
  let fromFile = null;
  try { const r = await fetch(CFG_PATH + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) fromFile = await r.json(); } catch (e) {}
  let cached = null; try { cached = JSON.parse(lsGet(CACHE_KEY) || "null"); } catch (e) {}
  const pick = cached && (!fromFile || (cached.savedAt || 0) > (fromFile.savedAt || 0)) ? cached : fromFile;
  if (pick) S.data = normalize(pick);
  S.loaded = true;
  if (!S.editing) render();
}
const b64 = str => { const bytes = new TextEncoder().encode(str); let bin = ""; for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]); return btoa(bin); };
async function ghPut(token, obj) {
  const api = `https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${CFG_PATH}`;
  const h = { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  let sha;
  const g = await fetch(api + "?ref=" + BRANCH + "&t=" + Date.now(), { headers: h, cache: "no-store" });
  if (g.status === 200) sha = (await g.json()).sha; else if (g.status !== 404) throw { status: g.status };
  const body = { message: "Update World Desk from the page", content: b64(JSON.stringify(obj, null, 2) + "\n"), branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(api, { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, h), body: JSON.stringify(body) });
  if (!r.ok) throw { status: r.status };
}
async function save(tokenOverride) {
  const d = S.draft;
  d.title = d.title.trim() || "World Desk";
  d.cards = d.cards.filter(c => c.name.trim() || c.url.trim());
  d.routine = d.routine.filter(r => r.text.trim());
  const token = tokenOverride || lsGet(TOK_KEY);
  if (!token) { S.needToken = true; render(); const t = document.getElementById("tok"); if (t) t.focus(); return; }
  const obj = Object.assign(clone(d), { savedAt: Date.now() });
  S.saving = true; render();
  try {
    await ghPut(token, obj);
    if (tokenOverride && S.rememberTok) lsSet(TOK_KEY, tokenOverride);
    lsSet(CACHE_KEY, JSON.stringify(obj));
    S.data = normalize(obj); S.editing = false; S.draft = null; S.needToken = false; S.tokErr = null;
    toast("Published. Everyone sees it within a minute or two.");
  } catch (e) {
    const st = e && e.status;
    S.tokErr = st === 401 ? "GitHub didn't accept that key. Check that it was copied in full and hasn't expired."
      : (st === 403 || st === 404) ? `That key can't change this site. It needs "Contents: Read and write" on ${REPO.owner}/${REPO.repo}.`
      : st === 409 ? "The file changed on GitHub at the same moment. Press Save again."
      : "Couldn't reach GitHub. Check your connection and try again.";
    if (st === 401 || st === 403 || st === 404) { lsSet(TOK_KEY, null); S.needToken = true; }
    toast("Not saved yet");
  }
  S.saving = false; render();
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, d = S.draft, i = +el.dataset.c, r = +el.dataset.r;
  if (a === "edit") { S.draft = clone(S.data); S.editing = true; S.confirmDel = null; S.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (!S.editing) return;
  if (a === "cancel") { S.editing = false; S.draft = null; render(); }
  else if (a === "save") save();
  else if (a === "tokSave") { const t = document.getElementById("tok"), v = t ? t.value.trim() : ""; const rem = document.getElementById("tokRemember"); S.rememberTok = !rem || rem.checked; if (!v) { S.tokErr = "Paste your GitHub key first."; render(); return; } S.tokErr = null; save(v); }
  else if (a === "tokCancel") { S.needToken = false; S.tokErr = null; render(); }
  else if (a === "forgetTok") { lsSet(TOK_KEY, null); toast("GitHub key removed from this device"); render(); }
  else if (a === "reset") { S.confirmReset = true; render(); }
  else if (a === "resetNo") { S.confirmReset = false; render(); }
  else if (a === "resetYes") { S.draft = clone(DEFAULT); S.confirmReset = false; render(); toast("Original layout restored. Press Save to keep it."); }
  else if (a === "color") { d.cards[i].color = el.dataset.v; render(); }
  else if (a === "up" && i > 0) { [d.cards[i - 1], d.cards[i]] = [d.cards[i], d.cards[i - 1]]; render(); }
  else if (a === "down" && i < d.cards.length - 1) { [d.cards[i + 1], d.cards[i]] = [d.cards[i], d.cards[i + 1]]; render(); }
  else if (a === "del") { S.confirmDel = i; render(); }
  else if (a === "delNo") { S.confirmDel = null; render(); }
  else if (a === "delYes") { d.cards.splice(i, 1); S.confirmDel = null; render(); }
  else if (a === "add") { d.cards.push({ id: "c" + Date.now().toString(36), name: "New card", url: "https://", desc: "", color: COLORS[d.cards.length % COLORS.length], font: "display", mark: "solid", todayType: "none", todayText: "", note: "", chips: "", cta: "Open" }); render(); const n = document.getElementById("n-" + (d.cards.length - 1)); if (n) { n.focus(); n.select(); } }
  else if (a === "rup" && r > 0) { [d.routine[r - 1], d.routine[r]] = [d.routine[r], d.routine[r - 1]]; render(); }
  else if (a === "rdown" && r < d.routine.length - 1) { [d.routine[r + 1], d.routine[r]] = [d.routine[r], d.routine[r + 1]]; render(); }
  else if (a === "rdel") { d.routine.splice(r, 1); render(); }
  else if (a === "radd") { d.routine.push({ text: "", when: "" }); render(); const n = document.getElementById("r-" + (d.routine.length - 1)); if (n) n.focus(); }
});
document.addEventListener("input", e => {
  if (!S.editing) return;
  const el = e.target, d = S.draft;
  if (el.dataset.k) d[el.dataset.k] = el.value;
  else if (el.dataset.c != null && el.dataset.f) d.cards[+el.dataset.c][el.dataset.f] = el.value;
  else if (el.dataset.r != null && el.dataset.f) d.routine[+el.dataset.r][el.dataset.f] = el.value;
});
document.addEventListener("change", e => {
  if (!S.editing) return;
  const el = e.target;
  if (el.tagName === "SELECT" && el.dataset.c != null) { S.draft.cards[+el.dataset.c][el.dataset.f] = el.value; render(); }
  else if (el.dataset.f === "url") render();
});
boot();
})();
</script>
