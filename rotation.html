<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Geopolitics Rotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an atlas desk. A sticky header carries the week's seven-segment rotation as a strip; the briefing reads in a 760px column, working views use a 1100px desk. */
:root {
  --bg: #E8ECEA;
  --surface: #FBFCFB;
  --surface-2: #F0F3F1;
  --ink: #1A2321;
  --muted: #586661;
  --line: #CFD7D3;
  --accent: #8C2F39;
  --accent-soft: #F3E2E4;
  --r1: #3A5A8C; --r1s: #E1E8F3;
  --r2: #A0660E; --r2s: #F5EAD6;
  --r3: #0F7A73; --r3s: #D9EFED;
  --r4: #3F7D2E; --r4s: #E2F0DC;
  --r5: #B0502A; --r5s: #F6E3DA;
  --r6: #7350A3; --r6s: #ECE4F5;
  --r7: #4F5B6A; --r7s: #E4E8ED;
  --good: #1F7A44; --good-soft: #DDF0E4;
  --warn: #946100; --warn-soft: #F6EBD0;
  --bad: #B3261E; --bad-soft: #F8DEDB;
  --info: #3D5A80; --info-soft: #E2E9F2;
  --f-display: "Bitter", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101614; --surface: #18201E; --surface-2: #1E2826; --ink: #E3E9E6; --muted: #93A29C; --line: #2C3835;
    --accent: #E88A95; --accent-soft: #3B1E23;
    --r1: #94B2E4; --r1s: #1E2A40; --r2: #E6B567; --r2s: #392C15; --r3: #5CC9BF; --r3s: #153533;
    --r4: #8CCB78; --r4s: #1D3317; --r5: #EE9A76; --r5s: #3D2219; --r6: #BCA1EA; --r6s: #2A2140; --r7: #AAB6C4; --r7s: #252C35;
    --good: #6CD39A; --good-soft: #17352A; --warn: #E9C06A; --warn-soft: #3A2E14; --bad: #F2948C; --bad-soft: #3F1D1A; --info: #9DB8DE; --info-soft: #1E2B3D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101614; --surface: #18201E; --surface-2: #1E2826; --ink: #E3E9E6; --muted: #93A29C; --line: #2C3835;
  --accent: #E88A95; --accent-soft: #3B1E23;
  --r1: #94B2E4; --r1s: #1E2A40; --r2: #E6B567; --r2s: #392C15; --r3: #5CC9BF; --r3s: #153533;
  --r4: #8CCB78; --r4s: #1D3317; --r5: #EE9A76; --r5s: #3D2219; --r6: #BCA1EA; --r6s: #2A2140; --r7: #AAB6C4; --r7s: #252C35;
  --good: #6CD39A; --good-soft: #17352A; --warn: #E9C06A; --warn-soft: #3A2E14; --bad: #F2948C; --bad-soft: #3F1D1A; --info: #9DB8DE; --info-soft: #1E2B3D;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[data-r="1"] { --rc: var(--r1); --rs: var(--r1s); } [data-r="2"] { --rc: var(--r2); --rs: var(--r2s); }
[data-r="3"] { --rc: var(--r3); --rs: var(--r3s); } [data-r="4"] { --rc: var(--r4); --rs: var(--r4s); }
[data-r="5"] { --rc: var(--r5); --rs: var(--r5s); } [data-r="6"] { --rc: var(--r6); --rs: var(--r6s); }
[data-r="7"] { --rc: var(--r7); --rs: var(--r7s); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
.week { display: flex; gap: 3px; }
.week span { width: 22px; height: 8px; border-radius: 2px; background: var(--rc); opacity: 0.35; }
.week span.now { opacity: 1; height: 12px; margin-top: -2px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 8px 12px 10px; border-bottom: 2px solid transparent; font-weight: 600; font-size: 0.95rem; }
nav.tabs a:hover { color: var(--ink); }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
main { max-width: 1140px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 64px; }
.view { display: grid; gap: 22px; }
.col { max-width: 780px; margin: 0 auto; width: 100%; display: grid; gap: 22px; min-width: 0; }
.banner { background: var(--warn-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; font-size: 0.92rem; }

.sec { display: grid; gap: 10px; min-width: 0; }
.h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.h2 .count { font-family: var(--f-mono); letter-spacing: 0; font-weight: 500; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.muted { color: var(--muted); } .small { font-size: 0.88rem; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px; color: var(--muted); }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.prose p { margin: 0 0 0.8em; } .prose p:last-child { margin-bottom: 0; } .prose { max-width: 70ch; }

.datebar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.when { font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; line-height: 1.15; margin: 0; text-wrap: balance; }
.segname { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--rc); margin-top: 4px; }
.segname::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--rc); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* Rotation strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { border-top: 4px solid var(--rc); background: var(--surface); border-radius: 0 0 6px 6px; padding: 6px 8px; font-size: 0.78rem; min-width: 0; }
.day b { display: block; font-family: var(--f-mono); font-weight: 500; color: var(--muted); font-size: 0.72rem; }
.day span { display: block; overflow-wrap: anywhere; line-height: 1.25; }
.day.now { background: var(--rs); font-weight: 700; }

.summary { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: var(--radius); padding: 16px 20px; }
.summary .prose { font-size: 1.08rem; }

.tiergroup + .tiergroup { margin-top: 12px; }
.tlabel { font-family: var(--f-mono); font-size: 0.76rem; color: var(--muted); padding: 6px 0; border-bottom: 1px solid var(--line); }
.item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .txt { min-width: 0; display: grid; gap: 5px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.82rem; }
.tier { font-family: var(--f-mono); font-size: 0.72rem; border-radius: 4px; padding: 1px 6px; height: fit-content; margin-top: 3px; white-space: nowrap; }
.tier.t1 { background: var(--ink); color: var(--surface); } .tier.t2 { border: 1px solid var(--muted); } .tier.t3 { border: 1px dashed var(--line); color: var(--muted); }
.ver { border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 0.74rem; }
.ver.Confirmed { background: var(--good-soft); color: var(--good); } .ver.Reported { background: var(--info-soft); color: var(--info); }
.ver.Claimed { background: var(--warn-soft); color: var(--warn); } .ver.Single-source { background: var(--bad-soft); color: var(--bad); }
.rchip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; font-weight: 700; color: var(--rc); background: var(--rs); border-radius: 4px; padding: 1px 7px; }
.country { font-weight: 600; font-size: 0.82rem; }
.thread { background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; color: var(--muted); cursor: pointer; font-size: 0.76rem; }
.thread:hover { color: var(--ink); border-color: var(--accent); }
.lnk { font-size: 0.82rem; text-decoration: none; border-bottom: 1px solid currentColor; }
.idtag { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); }
.opinion { font-size: 0.74rem; font-style: italic; color: var(--muted); }

.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.card h3 { margin: 0; font-family: var(--f-display); font-size: 1.1rem; font-weight: 600; line-height: 1.3; }
.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
textarea, input[type="text"], input[type="search"], select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
.uplist { display: grid; }
.up { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.up:last-child { border-bottom: 0; }
.up .d { font-family: var(--f-mono); font-size: 0.8rem; } .up .d small { display: block; color: var(--muted); }
.gaps { display: flex; flex-wrap: wrap; gap: 6px; }
.gap { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.82rem; background: var(--surface); }
.gap.ns { border-color: var(--bad); color: var(--bad); }
ul.srcs { margin: 0; padding-left: 18px; columns: 2 280px; column-gap: 28px; font-size: 0.9rem; }
ul.srcs li { break-inside: avoid; margin-bottom: 4px; overflow-wrap: anywhere; }

.filters { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 0.85rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.chip[data-r][aria-pressed="true"] { background: var(--rs); border-color: var(--rc); }
.frow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 8px; }
.dayhead { font-family: var(--f-display); font-weight: 600; font-size: 1.12rem; margin: 6px 0 0; }

.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: grid; gap: 8px; }
.wcard.due { border-color: var(--bad); }
.flag { border-radius: 4px; padding: 1px 7px; font-weight: 600; font-size: 0.76rem; }
.flag.bad { background: var(--bad-soft); color: var(--bad); } .flag.neutral { background: var(--surface-2); color: var(--muted); }
.flag.good { background: var(--good-soft); color: var(--good); } .flag.warn { background: var(--warn-soft); color: var(--warn); }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; }
.q h3 { margin: 0; font-size: 1rem; line-height: 1.4; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.opt.right { background: var(--good-soft); border-color: var(--good); } .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.score { font-family: var(--f-display); font-size: 1.4rem; font-weight: 700; }
.syn { display: grid; gap: 8px; border-left: 4px solid var(--rc); }
.dirs { display: flex; flex-wrap: wrap; gap: 6px; }

.primer { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: var(--radius); padding: 16px 18px; display: grid; gap: 12px; }
.primer h3 { font-family: var(--f-display); font-size: 1.3rem; margin: 0; font-weight: 700; }
.primer .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 14px; }
.primer h4 { margin: 0 0 4px; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.primer .now { background: var(--rs); border-radius: 6px; padding: 10px 12px; }

/* History lesson */
.hist { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--rc); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 14px; min-width: 0; }
.hist h3 { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700; line-height: 1.2; margin: 0; text-wrap: balance; }
.hist .prose { font-size: 1.05rem; line-height: 1.65; }
.hook { background: var(--rs); border-radius: 6px; padding: 10px 14px; }
.hook b, .matters b, .recallq b { display: block; font-size: 0.76rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--rc); margin-bottom: 2px; }
.hook ul { margin: 6px 0 0; padding-left: 18px; font-size: 0.92rem; }
ol.tl { list-style: none; margin: 8px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--rc); display: grid; gap: 8px; }
ol.tl li { display: grid; grid-template-columns: 92px 1fr; gap: 10px; position: relative; }
ol.tl li::before { content: ""; position: absolute; left: -20px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--rc); }
ol.tl .yr { font-family: var(--f-mono); font-size: 0.82rem; color: var(--muted); }
.persp { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin-top: 8px; }
.persp > div { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; }
dl.terms { display: grid; grid-template-columns: minmax(110px, 30%) 1fr; gap: 4px 12px; margin: 8px 0 0; font-size: 0.92rem; }
dl.terms dt { font-weight: 700; } dl.terms dd { margin: 0; min-width: 0; }
.matters { border-left: 3px solid var(--rc); padding: 2px 0 2px 12px; }
.recallq { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; }
.recallq b { color: var(--accent); }
details.recall-prev { background: var(--surface-2); border-radius: 6px; padding: 10px 14px; }
details.recall-prev summary { cursor: pointer; font-weight: 600; font-size: 0.92rem; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-size: 0.9rem; }
.stat b { font-family: var(--f-display); font-size: 1.15rem; }
.hlist { display: grid; gap: 6px; }
.hrow { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--rc); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.hrow .st { font-size: 0.76rem; font-weight: 700; border-radius: 4px; padding: 1px 7px; }
.hrow .st.got { background: var(--good-soft); color: var(--good); } .hrow .st.rev { background: var(--warn-soft); color: var(--warn); }
@media (max-width: 620px) { ol.tl li { grid-template-columns: 1fr; gap: 0; } dl.terms { grid-template-columns: 1fr; } }
.scroll { overflow-x: auto; }
table.plain { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.plain th, table.plain td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.plain th { color: var(--muted); font-weight: 700; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; }
table.plain td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.wide { min-width: 720px; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; }

/* Home link, Edit link and editor */
.homelink { font-size: 0.82rem; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 2px; }
.homelink:hover { color: var(--ink); text-decoration: underline; }
.brandr { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.editlink { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; font-weight: 600; text-decoration: none; color: var(--ink); background: var(--surface); }
.editlink:hover { border-color: var(--accent); }
.btn.small { padding: 3px 10px; font-size: 0.82rem; }
.fl { font-size: 0.8rem; font-weight: 700; color: var(--muted); }
.ff { display: grid; gap: 4px; margin-bottom: 10px; min-width: 0; }
.ff input, .ff textarea, .tokpanel input[type="password"], #eFile { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; font: inherit; color: inherit; }
.ff textarea { resize: vertical; line-height: 1.5; }
.hint { font-size: 0.8rem; color: var(--muted); }
.arr { display: grid; gap: 6px; }
.ai { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.aih { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; flex-wrap: wrap; }
.aibtn { background: none; border: 0; text-align: left; cursor: pointer; font-weight: 600; padding: 2px 4px; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
.aib { padding: 4px 12px 8px; border-top: 1px solid var(--line); }
.fs { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 10px; margin: 0 0 10px; min-width: 0; }
.fs legend { font-size: 0.8rem; font-weight: 700; color: var(--muted); padding: 0 4px; }
.editform { min-width: 0; }
.savebar { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.tokpanel { display: grid; gap: 8px; border-color: var(--accent); }
.tokpanel p { margin: 0; }
.tokpanel code { font-family: var(--f-mono); overflow-wrap: anywhere; }
.chk2 { display: inline-flex; gap: 8px; align-items: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
.chk2 input { width: 18px; height: 18px; }
.err { color: var(--bad); font-size: 0.85rem; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: 999px; padding: 8px 16px; font-size: 0.9rem; z-index: 20; }
@media (max-width: 620px) {
  .when { font-size: 1.45rem; }
  .strip { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .day { padding: 5px 4px; font-size: 0.68rem; }
  .day span { display: none; }
  .day.now span { display: none; }
  .up { grid-template-columns: 74px 1fr; }
  .week { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: rise 0.25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); } to { transform: none; } }
}
</style>
</head>
<body>
<!-- Geopolitics Rotation. Content is loaded from the data folder, which the daily runs update. -->


<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div><a class="homelink" href="./">← Home</a><h1 id="siteTitle">Geopolitics Rotation</h1></div>
      <div class="brandr"><div class="week" id="weekStrip" aria-hidden="true"></div><a class="editlink" href="#edit">Edit</a></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Views">
      <a href="#today">Today</a>
      <a href="#history">History</a>
      <a href="#timeline">Timeline</a>
      <a href="#watch">Watch</a>
      <a href="#reading">Reading</a>
      <a href="#sunday">Sunday</a>
      <a href="#regions">Regions</a>
      <a href="#threads">Threads</a>
      <a href="#sources">Sources</a>
      <a href="#how">How it works</a>
    </nav>
  </div>
</header>
<main>
  <div id="status" hidden class="banner"></div>
  <div id="app"></div>
</main>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(() => {
"use strict";

/* ---------- Constants ---------- */
const SEGMENTS = ["Russia–Ukraine & European security", "Middle East", "East & Southeast Asia", "The Americas", "Africa", "South & Central Asia", "EU politics + cross-cutting"];
const WEEKDAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
const COVERS = [
  "Front lines, talks, sanctions on Russia, NATO posture, Belarus, Moldova, Baltics",
  "Israel/Gaza/Lebanon, Iran, Gulf states, Syria, Yemen and the Red Sea",
  "China, Taiwan, Korean peninsula, Japan, South China Sea, ASEAN",
  "US foreign policy, trade and tariffs, sanctions and export controls, Latin America",
  "Sahel, Sudan, Horn of Africa, DRC and Great Lakes, North Africa, southern Africa",
  "India, Pakistan, Afghanistan, Bangladesh, Central Asian states, Caucasus",
  "EU institutions and enlargement; energy, arms control, UN Security Council, elections calendar"
];
const rNum = s => { const i = SEGMENTS.indexOf(s); return i < 0 ? 7 : i + 1; };
const DIRECTIONS = ["Escalating", "De-escalating", "Stable", "Mixed", "Unclear"];
const WATCH_STATUS = ["Happened as expected", "Partly", "Did not happen", "Postponed"];
const VIEWS = ["edit", "today", "history", "timeline", "watch", "reading", "sunday", "regions", "threads", "sources", "how"];

/* ---------- State ---------- */
const S = {
  db: null, dl: null, canWrite: true,
  briefs: [], briefIdx: 0, olderBriefsDone: false,
  eventDays: [], olderEventsDone: false,
  watch: [], reading: [], weekly: [], mine: {}, threads: [], regions: [], reporters: [], history: [],
  ui: { histOpen: null, histSeg: "", tl: { seg: "", country: "", tier: "", ver: "", from: "", thread: "", q: "" }, tlShow: 25, readFilter: "unread",
        week: null, synDraft: {}, srcTab: "balance", balDays: 30, repFilter: "" }
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => (typeof u === "string" && /^https?:\/\//i.test(u.trim())) ? u.trim() : "";
const arr = v => Array.isArray(v) ? v : [];
function inline(t) {
  let s = esc(t);
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, a, u) => `<a href="${u}" target="_blank" rel="noopener">${a}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return s;
}
const md = t => t ? String(t).split(/\n\s*\n/).map(p => `<p>${inline(p).replace(/\n/g, "<br>")}</p>`).join("") : "";
function linkHtml(l, i) {
  if (!l) return "";
  const url = safeUrl(typeof l === "string" ? l : l.url); if (!url) return "";
  let label = (typeof l === "object" && l.label) ? l.label : "";
  if (!label) { try { label = new URL(url).hostname.replace(/^www\./, ""); } catch (e) { label = "Source " + (i + 1); } }
  return `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
}
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayIso = () => isoDate(new Date());
const parseD = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const daysFrom = s => { const d = parseD(s); return d ? Math.round((d - parseD(todayIso())) / 86400000) : null; };
const fmtD = (s, o) => { const d = parseD(s); return d ? d.toLocaleDateString("en-GB", o || { day: "numeric", month: "short", year: "numeric" }) : esc(s || ""); };
const fmtLong = s => fmtD(s, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const rel = n => n == null ? "" : n === 0 ? "today" : n === 1 ? "tomorrow" : n === -1 ? "yesterday" : n > 0 ? `in ${n} days` : `${-n} days ago`;
const wdIndex = s => { const d = parseD(s) || new Date(); return (d.getDay() + 6) % 7; };
const segFor = s => SEGMENTS[wdIndex(s)];
const mondayOf = s => { const d = parseD(s) || new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoDate(d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoDate(d); };
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
const rchip = s => s ? `<span class="rchip" data-r="${rNum(s)}">${esc(s)}</span>` : "";
const tierTag = t => t ? `<span class="tier t${esc(t)}">T${esc(t)}</span>` : `<span></span>`;
const verTag = v => v ? `<span class="ver ${esc(String(v).replace(/\s+/g, "-"))}">${esc(v)}</span>` : "";
const threadTag = t => t ? `<button class="thread" data-act="thread" data-thread="${esc(t)}">${esc(t)}</button>` : "";
const empty = (t, b) => `<div class="empty"><strong>${esc(t)}</strong>${b}</div>`;

/* ---------- Static data layer: files published by the daily runs, personal state in this browser ---------- */
const BASE = "data/rotation/";
const LS_KEY = "rotation:mine";
function loadMine() { try { const v = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (v && typeof v === "object") return { docs: v.docs || {}, mine: v.mine || {} }; } catch (e) {} return { docs: {}, mine: {} }; }
function saveMine() { try { localStorage.setItem(LS_KEY, JSON.stringify(S.my)); return true; } catch (e) { return false; } }
function applyPatch(path, patch) {
  const parts = path.split("/"), coll = parts[0], id = parts.slice(1).join("/");
  if (coll === "mine") { S.mine[id] = Object.assign({}, S.mine[id] || {}, patch); S.my.mine[id] = S.mine[id]; return; }
  S.my.docs[path] = Object.assign({}, S.my.docs[path] || {}, patch);
  const list = S[coll]; const it = Array.isArray(list) ? list.find(x => x._id === id) : null; if (it) Object.assign(it, patch);
}
function write(path, fn) {
  const ref = { update: async p => applyPatch(path, p), set: async p => applyPatch(path, p), get: async () => ({ exists: true }) };
  return Promise.resolve(fn(ref)).then(() => { if (!saveMine()) toast("Couldn't save in this browser. Private browsing or blocked storage may be the cause."); render(); });
}
const upsert = (path, patch) => write(path, r => r.update(patch));
function overlay(coll, items) { return items.map(x => { x = Object.assign({}, x); x._id = x.id != null ? String(x.id) : x._id; const p = S.my.docs[coll + "/" + x._id]; return p ? Object.assign(x, p) : x; }); }
async function getJson(p) { const rc = recentGet(p); if (rc) return JSON.parse(JSON.stringify(rc)); const r = await fetch(BASE + p + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" }); if (!r.ok) throw new Error(String(r.status)); return r.json(); }
const itemsOf = j => Array.isArray(j) ? j : (j && Array.isArray(j.items) ? j.items : []);
function mergeBy(a, b, key) {
  const m = new Map(); a.concat(b).forEach(x => { if (x && !m.has(x[key])) m.set(x[key], x); });
  return Array.from(m.values()).sort((x, y) => String(y[key]).localeCompare(String(x[key])));
}
function showStatus(m) { const s = $("#status"); s.textContent = m; s.hidden = false; }
async function boot() {
  drawWeek();
  route(); window.addEventListener("hashchange", route);
  S.my = loadMine(); S.mine = Object.assign({}, S.my.mine);
  S.canWrite = true;
  S.dl = { save: async ({ filename, data }) => { const url = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" })); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); return { status: "saved" }; } };
  try { S.site = mergeSite(await getJson("site.json")); } catch (e) { S.site = mergeSite(null); }
  applySite();
  let man = null;
  try { man = await getJson("manifest.json"); } catch (e) { showStatus("Nothing published yet. The first daily run fills this page."); render(); return; }
  S.man = man; S.db = {};
  $("#status").hidden = true;
  const singles = ["watch", "reading", "threads", "regions", "reporters", "history"];
  await Promise.all(singles.map(async c => { try { S[c] = overlay(c, itemsOf(await getJson(c + ".json"))); } catch (e) { S[c] = []; } }));
  if (typeof afterSingles === "function") afterSingles();
  const pick = (k, n) => (Array.isArray(man[k]) ? man[k] : []).slice().sort().reverse().slice(0, n);
  const briefs = await Promise.all(pick("briefs", 7).map(d => getJson("briefs/" + d + ".json").catch(() => null)));
  S.briefs = mergeBy(briefs.filter(Boolean), [], "date");
  S.olderBriefsDone = (man.briefs || []).length <= S.briefs.length;
  const evs = await Promise.all(pick("events", 30).map(d => getJson("events/" + d + ".json").catch(() => null)));
  S.eventDays = mergeBy(evs.filter(Boolean), [], "date");
  S.olderEventsDone = (man.events || []).length <= S.eventDays.length;
  const wk = await Promise.all(pick("weekly", 26).map(d => getJson("weekly/" + d + ".json").catch(() => null)));
  S.weekly = wk.filter(Boolean).sort((a, b) => String(b.weekStart).localeCompare(String(a.weekStart)));
  S.ready = true;
  render();
}
async function loadOlderBriefs() {
  if (!S.man) { S.olderBriefsDone = true; return; }
  const have = new Set(S.briefs.map(b => b.date));
  const next = (S.man.briefs || []).slice().sort().reverse().filter(d => !have.has(d)).slice(0, 7);
  if (!next.length) { S.olderBriefsDone = true; return; }
  const got = await Promise.all(next.map(d => getJson("briefs/" + d + ".json").catch(() => null)));
  S.briefs = mergeBy(S.briefs, got.filter(Boolean), "date");
  if ((S.man.briefs || []).length <= S.briefs.length) S.olderBriefsDone = true;
}
async function loadOlderEvents(n) {
  if (!S.man) return false;
  const have = new Set(S.eventDays.map(b => b.date));
  const next = (S.man.events || []).slice().sort().reverse().filter(d => !have.has(d)).slice(0, n || 30);
  if (!next.length) { S.olderEventsDone = true; return false; }
  const got = await Promise.all(next.map(d => getJson("events/" + d + ".json").catch(() => null)));
  S.eventDays = mergeBy(S.eventDays, got.filter(Boolean), "date");
  if ((S.man.events || []).length <= S.eventDays.length) S.olderEventsDone = true;
  return true;
}
function afterSingles() {
  S.history.sort((x, y) => String(y.date).localeCompare(String(x.date)));
}
function allEvents() { const out = []; S.eventDays.forEach(day => arr(day.items).forEach(it => out.push(Object.assign({ _day: day.date }, it)))); return out; }

function drawWeek() {
  const t = wdIndex(todayIso());
  $("#weekStrip").innerHTML = SEGMENTS.map((s, i) => `<span data-r="${i + 1}" class="${i === t ? "now" : ""}" title="${esc(WEEKDAYS[i] + ": " + s)}"></span>`).join("");
}

/* ---------- Routing / render ---------- */
function route() {
  const h = (location.hash || "").replace("#", "");
  S.view = VIEWS.includes(h) ? h : "today";
  document.querySelectorAll("#tabs a").forEach(a => a.setAttribute("aria-current", a.getAttribute("href") === "#" + S.view ? "page" : "false"));
  const cur = document.querySelector('#tabs a[aria-current="page"]'); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  render(); window.scrollTo(0, 0);
}
function render() {
  const app = $("#app");
  const ae = document.activeElement;
  if (ae && /TEXTAREA|INPUT/.test(ae.tagName) && ae.dataset.keep && app.contains(ae)) return;
  const keep = ae && ae.id;
  const fn = { edit: vEdit, today: vToday, history: vHistory, timeline: vTimeline, watch: vWatch, reading: vReading, sunday: vSunday, regions: vRegions, threads: vThreads, sources: vSources, how: vHow }[S.view];
  app.innerHTML = `<div class="view">${fn()}</div>`;
  if (keep) { const el = document.getElementById(keep); if (el && el.type === "search") { el.focus(); const v = el.value; el.value = ""; el.value = v; } }
}

function itemHtml(it, o) {
  o = o || {};
  const links = arr(it.links).length ? arr(it.links) : [it.link1 && { url: it.link1, label: it.outlet || "" }, it.link2 && { url: it.link2, label: "Cross-check" }, it.archive && { url: it.archive, label: "Archive" }].filter(Boolean);
  const seg = it.segment || it.region;
  return `<div class="item">${tierTag(it.tier)}<div class="txt">
    <div>${it.country ? `<span class="country">${esc(it.country)}:</span> ` : ""}${inline(it.text || "")}${it.opinion ? ` <span class="opinion">(${esc(it.opinion)})</span>` : ""}</div>
    <div class="meta">${o.seg ? rchip(seg) : ""}${verTag(it.verification)}${it.reporter ? `<span class="muted">${esc(it.reporter)}${it.outlet ? ", " + esc(it.outlet) : ""}</span>` : (o.outlet && it.outlet ? `<span class="muted">${esc(it.outlet)}</span>` : "")}${threadTag(it.thread)}
      ${links.map(linkHtml).join(" ")}${it.paywalled === "Y" || it.paywalled === true ? `<span class="muted">paywall</span>` : ""}${o.from && it.loggedFrom === "Daily Tier 1 check" ? `<span class="flag neutral">Tier 1 check</span>` : ""}${it.id ? `<span class="idtag">${esc(it.id)}</span>` : ""}</div>
  </div></div>`;
}
function byTier(items, o) {
  const g = {}; items.forEach(i => (g[i.tier || 9] = g[i.tier || 9] || []).push(i));
  return Object.keys(g).sort().map(t => `<div class="tiergroup"><div class="tlabel">${t === "9" ? "Untiered" : "Tier " + esc(t)}</div>${g[t].map(i => itemHtml(i, o)).join("")}</div>`).join("");
}
function strip(date) {
  const mon = mondayOf(date), t = wdIndex(date);
  return `<div class="strip" aria-label="This week's rotation">${SEGMENTS.map((s, i) => `<div class="day ${i === t ? "now" : ""}" data-r="${i + 1}"><b>${WEEKDAYS[i].slice(0, 3)} ${fmtD(addDays(mon, i), { day: "numeric" })}</b><span>${esc(s)}</span></div>`).join("")}</div>`;
}

/* ---------- Today ---------- */
function vToday() {
  const today = todayIso();
  if (!S.briefs.length) {
    const s = segFor(today);
    return `<div class="col"><div class="datebar"><div><p class="when">${fmtLong(today)}</p><div class="segname" data-r="${rNum(s)}">Today: ${esc(s)}</div></div></div>${strip(today)}
      ${empty("Your first brief arrives with the first daily run.", `<p>Each day covers one of seven regions in depth, everything since that region was last covered, plus a quick Tier 1 check across all regions. Over a week the rotation covers the whole world.</p>`)}</div>`;
  }
  const i = Math.min(S.briefIdx, S.briefs.length - 1);
  const b = S.briefs[i];
  const seg = b.segment || segFor(b.date);
  const myDay = S.mine["day-" + b.date] || {};
  let h = `<div class="col"><div class="datebar">
    <div><p class="when">${fmtLong(b.date)}</p><div class="segname" data-r="${rNum(seg)}">${esc(seg)}</div>${b.windowFrom ? `<div class="small muted">Covering ${fmtD(b.windowFrom, { day: "numeric", month: "short" })} to ${fmtD(b.date, { day: "numeric", month: "short" })}</div>` : ""}</div>
    <div class="btnrow"><button class="btn" data-act="older" ${i >= S.briefs.length - 1 && S.olderBriefsDone ? "disabled" : ""}>← Older</button><button class="btn" data-act="newer" ${i === 0 ? "disabled" : ""}>Newer →</button></div>
  </div>${strip(b.date)}`;

  if (b.tier1Summary) h += `<section class="sec"><div class="h2">${esc(H("tier1Summary", "Tier 1 summary"))}</div><div class="summary"><div class="prose">${md(b.tier1Summary)}</div></div></section>`;

  const hist = S.history.find(x => x.date === b.date);
  if (hist) h += `<section class="sec"><div class="h2">${esc(H("background", "The background"))}</div>${historyCard(hist, true)}</section>`;
  else if (b.date === todayIso()) h += `<div class="empty small">Today's history lesson appears here once the history run has finished.</div>`;

  const segItems = arr(b.segmentItems);
  h += `<section class="sec" data-r="${rNum(seg)}"><div class="h2">${rchip(seg)} <span class="count">${segItems.length}</span></div><div class="panel">${segItems.length ? byTier(segItems) : `<p class="muted" style="margin:0">No items in this segment.</p>`}</div></section>`;

  const t1 = arr(b.tier1Check);
  h += `<section class="sec"><div class="h2">${esc(H("tier1Check", "Daily Tier 1 check · all regions"))} <span class="count">${t1.length}</span></div><div class="panel">${t1.length ? t1.map(x => itemHtml(x, { seg: true })).join("") : `<p class="muted" style="margin:0">No Tier 1 developments outside today's segment.</p>`}</div></section>`;

  if (arr(b.readInFull).length) h += `<section class="sec"><div class="h2">${esc(H("readInFull", "Read in full"))}</div><div class="cards">${arr(b.readInFull).map(r => { const d = r.readingId ? S.reading.find(x => x._id === r.readingId) : null; return readingCard(Object.assign({}, r, d || {}), d ? d._id : null); }).join("")}</div></section>`;

  if (arr(b.watchThisWeek).length) h += `<section class="sec"><div class="h2">${esc(H("watchThisWeek", "Watch this week"))}</div><div class="panel uplist">${arr(b.watchThisWeek).slice().sort((x, y) => String(x.date).localeCompare(String(y.date))).map(w => `<div class="up"><div class="d">${w.date ? fmtD(w.date, { day: "numeric", month: "short" }) : "Any time"}<small>${w.date ? rel(daysFrom(w.date)) : ""}</small></div><div>${inline(w.text)} <span class="meta" style="display:inline-flex">${rchip(w.segment)}</span></div></div>`).join("")}</div></section>`;

  if (arr(b.gaps).length) h += `<section class="sec"><div class="h2">${esc(H("gaps", "Coverage gaps"))}</div><div class="gaps">${arr(b.gaps).map(g => `<span class="gap ${/no source/i.test(g.status || "") ? "ns" : ""}">${esc(g.country || g.area || "")} — ${esc(g.status || "quiet")}</span>`).join("")}</div><div class="small muted">Red means nothing was found because sources were missing, not because it was quiet.</div></section>`;

  if (arr(b.sources).length) h += `<section class="sec"><div class="h2">${esc(H("sources", "Sources"))} <span class="count">${arr(b.sources).length}</span></div><div class="panel"><ul class="srcs">${arr(b.sources).map((s, k) => `<li>${linkHtml(typeof s === "string" ? s : { url: s.url, label: s.title }, k)}${s.paywalled ? ' <span class="muted">(paywall)</span>' : ""}</li>`).join("")}</ul></div></section>`;

  if (S.canWrite) h += `<div class="panel btnrow" style="justify-content:space-between"><span>Done for today?</span><label class="check"><input type="checkbox" data-act="briefRead" data-date="${esc(b.date)}" ${myDay.briefRead ? "checked" : ""}> I read this brief</label></div>`;
  return h + `</div>`;
}
function readingCard(r, id) {
  return `<article class="card">
    <div class="meta">${rchip(r.segment)}${r.language && r.language !== "English" ? `<span class="flag neutral">${esc(r.language)}</span>` : ""}</div>
    <h3>${safeUrl(r.url) ? `<a href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener" style="color:inherit">${esc(r.title)}</a>` : esc(r.title)}</h3>
    <div class="small muted">${esc([r.reporter, r.outlet].filter(Boolean).join(" · "))}</div>
    ${r.why ? `<div class="small">${inline(r.why)}</div>` : ""}
    ${id && S.canWrite ? `<label class="check"><input type="checkbox" data-act="readToggle" data-id="${esc(id)}" ${r.read ? "checked" : ""}> I read it</label>
      <textarea id="note-${esc(id)}" data-keep="1" data-act="readNote" data-id="${esc(id)}" placeholder="One line on what you took from it">${esc(r.notes || "")}</textarea>` : ""}
  </article>`;
}

/* ---------- History ---------- */
function historyCard(x, today) {
  const news = arr(x.eventIds).map(id => { const e = allEvents().find(v => v.id === id); return e ? `<li>${e.country ? esc(e.country) + ": " : ""}${inline(e.text)} <span class="idtag">${esc(id)}</span></li>` : ""; }).join("");
  return `<article class="hist" data-r="${rNum(x.segment)}">
    <div class="meta">${rchip(x.segment)}${x.thread ? threadTag(x.thread) : ""}${x.minutes ? `<span class="muted">${esc(x.minutes)} min read</span>` : ""}${!today ? `<span class="muted">${fmtD(x.date)}</span>` : ""}</div>
    ${today && x.prevAnswer ? `<details class="recall-prev"><summary>Yesterday's question: ${esc(x.prevQuestion || "show the answer")}</summary><div class="prose" style="margin-top:6px">${md(x.prevAnswer)}</div></details>` : ""}
    <h3>${esc(x.title)}</h3>
    ${x.hook || news ? `<div class="hook"><b>Why now</b>${inline(x.hook || "")}${news ? `<ul>${news}</ul>` : ""}</div>` : ""}
    <div class="prose">${md(x.body)}</div>
    ${arr(x.timeline).length ? `<div><div class="h2">How it got here</div><ol class="tl">${arr(x.timeline).map(t => `<li><span class="yr">${esc(t.when)}</span><span>${inline(t.text)}</span></li>`).join("")}</ol></div>` : ""}
    ${arr(x.perspectives).length ? `<div><div class="h2">How each side tells it</div><div class="persp">${arr(x.perspectives).map(p => `<div><b>${esc(p.side)}</b><div class="small">${inline(p.view)}</div></div>`).join("")}</div></div>` : ""}
    ${arr(x.keyTerms).length ? `<div><div class="h2">Key terms</div><dl class="terms">${arr(x.keyTerms).map(t => `<dt>${esc(t.term)}</dt><dd>${inline(t.meaning)}</dd>`).join("")}</dl></div>` : ""}

    ${S.canWrite ? `<div class="btnrow"><span class="small muted">How did this land?</span>

function vHistory() {

/* ---------- Timeline ---------- */

/* ---------- Watch ---------- */
function vWatch() {
  if (!S.watch.length) return `<div class="col">${empty("Nothing on the watch list yet.", `<p>Each brief's "Watch this week" items land here with a check date and the expected outcome. Once the date passes, the next run records what happened and you judge whether the expectation held.</p>`)}</div>`;
  const open = w => !w.status || w.status === "Open";
  const due = S.watch.filter(w => open(w) && w.checkDate && daysFrom(w.checkDate) < 0).sort((a, b) => String(a.checkDate).localeCompare(String(b.checkDate)));
  const up = S.watch.filter(w => open(w) && !(w.checkDate && daysFrom(w.checkDate) < 0)).sort((a, b) => String(a.checkDate || "9").localeCompare(String(b.checkDate || "9")));
  const done = S.watch.filter(w => !open(w));
  const card = (w, isDue) => `<article class="wcard ${isDue ? "due" : ""}">
    <div class="meta">${rchip(w.segment)}<span class="flag ${isDue ? "bad" : "neutral"}">${w.checkDate ? fmtD(w.checkDate) + " · " + rel(daysFrom(w.checkDate)) : "No date"}</span><span class="idtag">${esc(w.id || w._id)}</span></div>
    <div><strong>${inline(w.what || "")}</strong></div>
    ${w.expected ? `<div class="small"><span class="muted">Expected:</span> ${inline(w.expected)}</div>` : ""}
    ${w.happened ? `<div class="small"><span class="muted">What happened:</span> ${inline(w.happened)}</div>` : (isDue ? `<div class="small muted">The next daily run will fill in what happened.</div>` : "")}
    ${(isDue || !open(w)) && S.canWrite ? `<div class="btnrow">${WATCH_STATUS.map(s => `<button class="btn ${w.status === s ? "on" : ""}" data-act="verdict" data-id="${esc(w._id)}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
  </article>`;
  let h = `<div class="col"><section class="sec"><div class="h2">Your verdict needed <span class="count">${due.length}</span></div>${due.length ? due.map(w => card(w, true)).join("") : `<p class="muted small" style="margin:0">Nothing waiting on you.</p>`}</section>
    <section class="sec"><div class="h2">Coming up <span class="count">${up.length}</span></div>${up.length ? up.map(w => card(w, false)).join("") : `<p class="muted small" style="margin:0">Nothing scheduled.</p>`}</section>`;

      ${S.canWrite ? `<div class="dirs" role="group" aria-label="Direction">${DIRECTIONS.map(d => `<button class="chip" aria-pressed="${cur.direction === d}" data-act="dir" data-seg="${esc(s)}" data-v="${d}">${d}</button>`).join("")}</div>
      <textarea id="syn-${rNum(s)}" data-keep="1" data-act="syn" data-seg="${esc(s)}" placeholder="How did this week compare with last?">${esc(cur.text || "")}</textarea>` : `${cur.direction ? `<div><strong>${esc(cur.direction)}</strong></div>` : ""}<div>${md(cur.text || "")}</div>`}

/* ---------- Regions ---------- */

/* ---------- Sources ---------- */
function vSources() {
  const t = S.ui.srcTab;
  let h = `<div class="subtabs">${[["balance", "Source balance"], ["reporters", "Reporters"]].map(([k, l]) => `<button class="chip" aria-pressed="${t === k}" data-act="srcTab" data-v="${k}">${l}</button>`).join("")}</div>`;
  if (t === "balance") {
    const n = S.ui.balDays, from = addDays(todayIso(), -(n - 1));
    const evs = allEvents().filter(e => (e.dateLogged || e._day) >= from);
    h += `<div class="btnrow"><span class="small muted">Range:</span>${[7, 30, 90].map(d => `<button class="chip" aria-pressed="${n === d}" data-act="balDays" data-v="${d}">Last ${d} days</button>`).join("")}</div>`;
    if (!S.eventDays.length) return h + empty("Source balance fills as events are logged.", `<p>For each region it shows how many events came from named reporters, how many outlets were used, and whether one outlet dominates. Regions seen through too few sources get flagged.</p>`);
    h += `<div class="panel scroll"><table class="plain wide"><thead><tr><th>Region</th><th>Events</th><th>Named reporter</th><th>Local language</th><th>Outlets</th><th>Top outlet share</th><th>Flag</th></tr></thead><tbody>${SEGMENTS.map(s => {
      const pe = evs.filter(e => e.segment === s), c = pe.length;
      if (!c) return `<tr><td>${rchip(s)}</td><td class="num">0</td><td></td><td></td><td></td><td></td><td></td></tr>`;
      const named = pe.filter(e => e.reporter).length / c, local = pe.filter(e => e.language && e.language !== "English").length / c;
      const o = {}; pe.forEach(e => { if (e.outlet) o[e.outlet] = (o[e.outlet] || 0) + 1; });
      const distinct = Object.keys(o).length, topN = Math.max(0, ...Object.values(o)), top = topN / c, topName = Object.keys(o).find(k => o[k] === topN) || "";
      const narrow = c >= 5 && (top > 0.5 || distinct < 3);
      return `<tr><td>${rchip(s)}</td><td class="num">${c}</td><td class="num">${Math.round(named * 100)}%</td><td class="num">${Math.round(local * 100)}%</td><td class="num">${distinct}</td><td class="num">${Math.round(top * 100)}% <span class="small muted">${esc(topName)}</span></td><td>${narrow ? `<span class="flag bad">Narrow: widen sources</span>` : ""}</td></tr>`;
    }).join("")}</tbody></table></div><div class="small muted">Flagged when a region has 5+ events and one outlet supplies over half of them, or fewer than 3 outlets were used. "Local language" counts events sourced in a language other than English.</div>`;
    if (S.eventDays.length && !S.olderEventsDone && S.eventDays[S.eventDays.length - 1].date > from) h += `<div class="btnrow"><button class="btn" data-act="tlOlder">Load older days for this range</button></div>`;

  if (!S.reporters.length) return h + empty("The reporter roster is built by the daily runs.", `<p>Reporters who work in the local language, are based in or regularly report from the region, and have a track record. New ones arrive marked Watch; you decide whether they stay Active or are Dropped.</p>`);
  const list = S.reporters.filter(r => !f || r.segment === f).sort((a, b) => ({ Watch: 0, Active: 1, Dropped: 2 }[a.status] ?? 1) - ({ Watch: 0, Active: 1, Dropped: 2 }[b.status] ?? 1) || String(a.name).localeCompare(String(b.name)));
  const pending = S.reporters.filter(r => r.status === "Watch").length;
  h += `<div class="small muted">${S.reporters.length} reporters · ${pending} waiting for your review</div>`;
  return h + `<div class="cards">${list.map(r => `<article class="card" data-r="${rNum(r.segment)}">
    <div class="meta">${rchip(r.segment)}${r.status ? `<span class="flag ${r.status === "Active" ? "good" : r.status === "Watch" ? "warn" : "neutral"}">${esc(r.status)}</span>` : ""}</div>

    const ws = S.ui.week, mine = S.mine["week-" + ws] || {}, synthesis = JSON.parse(JSON.stringify(mine.synthesis || {})), d = S.ui.synDraft[ws] || {};
    Object.keys(d).forEach(s => synthesis[s] = Object.assign({}, synthesis[s] || {}, d[s]));
    await upsert("mine/week-" + ws, { synthesis, weekStart: ws, savedAt: Date.now() }); delete S.ui.synDraft[ws]; toast("Synthesis saved"); render();
  }
  else if (a === "srcTab") { S.ui.srcTab = el.dataset.v; render(); }
  else if (a === "balDays") {
    S.ui.balDays = +el.dataset.v; render();
    const from = addDays(todayIso(), -(S.ui.balDays - 1)); let g = 0;
    while (g++ < 10 && S.eventDays.length && !S.olderEventsDone && S.eventDays[S.eventDays.length - 1].date > from) { if (!(await loadOlderEvents(30))) break; }
    render();
  }
  else if (a === "histOpen") { S.ui.histOpen = S.ui.histOpen === el.dataset.id ? null : el.dataset.id; render(); }
  else if (a === "histSeg") { S.ui.histSeg = el.dataset.v; render(); }
  else if (a === "histUnd") { const v = el.dataset.v; write("history/" + el.dataset.id, r => r.update({ understood: v })); toast(v === "got" ? "Marked as understood" : "Marked to revisit"); }
  else if (a === "repFilter") { S.ui.repFilter = el.dataset.v; render(); }
  else if (a === "repStatus") { const v = el.dataset.v; write("reporters/" + el.dataset.id, r => r.update({ status: v, lastReviewed: todayIso() })); toast("Reporter marked " + v); }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "briefRead") { const d = el.dataset.date, v = el.checked; upsert("mine/day-" + d, { briefRead: v, date: d }); toast(v ? "Nice. See you tomorrow." : "Unmarked"); }
  else if (a === "readToggle") { const v = el.checked; write("reading/" + el.dataset.id, r => r.update({ read: v, readOn: v ? todayIso() : null })); }
  else if (a === "tlSel") { S.ui.tl[el.dataset.k] = el.value; S.ui.tlShow = 25; render(); }
  else if (a === "weekSel") { S.ui.week = el.value; render(); }
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "tlSearch") { S.ui.tl.q = el.value; S.ui.tlShow = 25; clearTimeout(vTimeline._t); vTimeline._t = setTimeout(render, 200); }
  else if (a === "syn") { const ws = S.ui.week, d = S.ui.synDraft[ws] = S.ui.synDraft[ws] || {}; (d[el.dataset.seg] = d[el.dataset.seg] || {}).text = el.value; }
});
document.addEventListener("focusout", e => {
  const el = e.target, a = el.dataset && el.dataset.act; if (!a) return;
  if (a === "readNote") { const v = el.value, cur = (S.reading.find(r => r._id === el.dataset.id) || {}).notes || ""; if (v !== cur) { write("reading/" + el.dataset.id, r => r.update({ notes: v })); toast("Note saved"); } setTimeout(render, 0); }
  else if (a === "histNote") { const v = el.value, cur = (S.history.find(r => r._id === el.dataset.id) || {}).notes || ""; if (v !== cur) { write("history/" + el.dataset.id, r => r.update({ notes: v })); toast("Note saved"); } setTimeout(render, 0); }
  else if (a === "syn") setTimeout(render, 0);
});
async function exportCsv() {
  if (!S.dl) return;
  const cols = ["id", "dateLogged", "eventDate", "loggedFrom", "segment", "country", "text", "tier", "verification", "reporter", "outlet", "language", "link1", "link2", "archive", "paywalled", "thread", "followsUp", "notes"];
  const q = v => { const s = String(v == null ? "" : v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = allEvents().map(e => cols.map(c => q(c === "dateLogged" ? (e.dateLogged || e._day) : e[c])).join(","));
  try { await S.dl.save({ filename: `geopolitics-events-${todayIso()}.csv`, data: "﻿" + cols.join(",") + "\n" + rows.join("\n") }); toast("Saved"); }
  catch (err) { if (err && err.code !== "declined") toast("Couldn't save the file here."); }
}
boot();
})();
